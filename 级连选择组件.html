<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>级连选择组件</title>
  <!--
    还原来源：级连选择.sketch

    设计假设：
    - 这是“流程节点 → 节点参数”的两级选择器。
    - 触发器保持设计稿的 176 × 30px，菜单项保持 30px 高。
    - 二级面板支持左侧、右侧和自动三种展开方式。
    - 单文件、无外部依赖，可直接双击打开。
  -->
  <style>
    :root {
      --primary: #0c9b72;
      --primary-soft: #e8f8f3;
      --purple: #6c63ff;
      --text: #333333;
      --muted: #aaaaaa;
      --icon-muted: #c8cdca;
      --border: #e5eae7;
      --surface: #ffffff;
      --page: #f6f8f7;
      --hover: #f6f6f6;
      --selected: #e5eae7;
      --shadow: 0 15px 25px rgba(25, 38, 32, 0.1);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background: var(--page);
      font-family: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    button:focus-visible {
      outline: 2px solid rgba(12, 155, 114, 0.32);
      outline-offset: 2px;
    }

    .page {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 48px 24px 180px;
    }

    .demo {
      display: grid;
      width: min(720px, 100%);
      justify-items: center;
      gap: 24px;
    }

    .intro {
      text-align: center;
    }

    .intro h1 {
      margin: 0 0 8px;
      color: #222222;
      font-size: 20px;
      font-weight: 600;
      line-height: 28px;
    }

    .intro p {
      margin: 0;
      color: #777c79;
      font-size: 13px;
      line-height: 22px;
    }

    .direction-control {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #777c79;
      font-size: 12px;
    }

    .demo-toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .segmented {
      display: inline-flex;
      gap: 2px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      background: var(--surface);
    }

    .direction-button {
      height: 26px;
      border: 0;
      border-radius: 5px;
      padding: 0 10px;
      color: #777c79;
      background: transparent;
      cursor: pointer;
    }

    .direction-button:hover { color: var(--primary); }

    .direction-button.is-active {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .preview {
      display: grid;
      width: min(520px, 100%);
      min-height: 240px;
      place-items: start center;
      padding: 32px;
      border: 1px solid rgba(47, 67, 58, 0.08);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 12px 40px rgba(35, 52, 44, 0.06);
    }

    .cascade {
      position: relative;
      width: 176px;
      color: var(--text);
      font-size: 12px;
      line-height: 20px;
    }

    .cascade-trigger {
      position: relative;
      display: block;
      width: 176px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0;
      color: var(--text);
      background: var(--surface);
      cursor: pointer;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    .cascade.is-open .cascade-trigger {
      border-color: #b9d9cf;
      box-shadow: 0 0 0 2px rgba(12, 155, 114, 0.08);
    }

    .selection-chip {
      position: absolute;
      top: 2px;
      left: 2px;
      display: flex;
      width: 132px;
      height: 24px;
      flex: 0 0 132px;
      align-items: center;
      gap: 3px;
      overflow: hidden;
      border-radius: 8px;
      padding: 4px 0 4px 4px;
      background: #e5eae7;
    }

    .selection-chip.is-empty {
      color: var(--muted);
      background: transparent;
    }

    .selection-chip[hidden],
    .selection-placeholder[hidden] { display: none !important; }

    .selection-placeholder {
      position: absolute;
      top: 4px;
      left: 9px;
      height: 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 20px;
    }

    .selection-source {
      display: flex;
      width: 66px;
      height: 16px;
      flex: 0 0 66px;
      align-items: center;
      gap: 3px;
      overflow: hidden;
    }

    .selection-primary,
    .selection-secondary {
      overflow: hidden;
      white-space: nowrap;
      font-size: 12px;
      line-height: 14px;
    }

    .selection-primary {
      width: 47px;
      flex: 0 0 47px;
      color: #0c9b72;
    }

    .selection-secondary {
      width: 40px;
      flex: 0 0 40px;
      color: var(--text);
    }

    .clear-button,
    .settings-button {
      display: grid;
      border: 0;
      padding: 0;
      place-items: center;
      color: var(--icon-muted);
      background: transparent;
      cursor: pointer;
    }

    .clear-button {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      border-radius: 3px;
    }

    .settings-button {
      position: absolute;
      top: 4px;
      left: 150px;
      width: 20px;
      height: 20px;
      border-radius: 5px;
    }

    .clear-button:hover,
    .settings-button:hover { color: #8f9692; }

    .doc-icon {
      display: grid;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      place-items: center;
    }

    .doc-icon.is-compact {
      width: 16px;
      height: 16px;
      flex-basis: 16px;
    }

    .doc-icon svg { width: 100%; height: 100%; }

    .cascade-popover {
      position: absolute;
      z-index: 20;
      top: 35px;
      left: 0;
      display: none;
      width: 326px;
      height: 100px;
    }

    .cascade.is-open .cascade-popover { display: block; }

    .cascade-popover.opens-left { left: -150px; }

    .menu-panel {
      position: absolute;
      top: 0;
      overflow-x: hidden;
      overflow-y: auto;
      height: 100px;
      border-radius: 8px;
      padding: 5px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .process-panel {
      left: 0;
      width: 176px;
    }

    .parameter-panel {
      left: 176px;
      width: 150px;
    }

    .opens-left .process-panel { left: 150px; }
    .opens-left .parameter-panel { left: 0; }

    .menu-item {
      display: flex;
      width: 100%;
      height: 30px;
      align-items: center;
      gap: 5px;
      border: 0;
      border-radius: 6px;
      padding: 5px;
      color: var(--text);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .menu-item:hover,
    .menu-item.is-focused { background: var(--hover); }

    .menu-item.is-active { background: var(--selected); }

    .menu-label {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .chevron {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      color: var(--icon-muted);
    }

    .type-tag {
      display: inline-flex;
      height: 20px;
      align-items: center;
      border-radius: 5px;
      padding: 0 5px;
      color: #ffffff;
      background: var(--primary);
      line-height: 20px;
    }

    .status {
      min-height: 20px;
      margin-top: 14px;
      color: #777c79;
      font-size: 12px;
      text-align: center;
    }

    .editor-backdrop {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(26, 31, 29, 0.28);
    }

    .editor-backdrop[hidden] { display: none !important; }

    .editor-dialog {
      display: grid;
      width: min(640px, 100%);
      max-height: min(720px, calc(100vh - 48px));
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 24px 64px rgba(25, 38, 32, 0.18);
    }

    .editor-header,
    .editor-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
    }

    .editor-header { border-bottom: 1px solid var(--border); }
    .editor-footer {
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--border);
    }

    .editor-title {
      margin: 0;
      color: #222222;
      font-size: 16px;
      font-weight: 600;
      line-height: 24px;
    }

    .editor-subtitle {
      margin: 2px 0 0;
      color: #888d8a;
      font-size: 12px;
      line-height: 20px;
    }

    .dialog-close,
    .row-delete {
      border: 0;
      color: #9da29f;
      background: transparent;
      cursor: pointer;
    }

    .dialog-close {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-size: 20px;
      line-height: 26px;
    }

    .dialog-close:hover,
    .row-delete:hover { color: #e53e3e; }

    .editor-body {
      overflow: auto;
      padding: 16px 20px 20px;
    }

    .editor-toolbar,
    .parameter-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .editor-toolbar {
      position: sticky;
      z-index: 2;
      top: -16px;
      margin: -16px 0 12px;
      padding: 16px 0 10px;
      background: var(--surface);
    }

    .editor-count,
    .parameter-count {
      color: #6f746f;
      font-size: 12px;
    }

    .text-button {
      height: 30px;
      border: 1px solid #b9d9cf;
      border-radius: 6px;
      padding: 0 10px;
      color: var(--primary);
      background: var(--primary-soft);
      cursor: pointer;
    }

    .text-button:hover { background: #ddf3ec; }

    .editor-list {
      display: grid;
      gap: 12px;
    }

    .level-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #fbfcfb;
    }

    .level-header {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 8px;
    }

    .level-number {
      color: #8a8f8c;
      font-size: 12px;
      text-align: center;
    }

    .editor-input,
    .editor-select {
      width: 100%;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
      color: var(--text);
      background: var(--surface);
      font: inherit;
      font-size: 12px;
      outline: none;
    }

    .editor-input:focus,
    .editor-select:focus {
      border-color: #8fcdbb;
      box-shadow: 0 0 0 2px rgba(12, 155, 114, 0.08);
    }

    .row-delete {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      font-size: 16px;
    }

    .parameter-area {
      margin: 10px 0 0 36px;
      padding-top: 10px;
      border-top: 1px solid #edf0ee;
    }

    .parameter-list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .parameter-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 88px 28px;
      align-items: center;
      gap: 6px;
    }

    .empty-editor-row {
      padding: 14px;
      color: #9aa09c;
      font-size: 12px;
      text-align: center;
    }

    .dialog-button {
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 16px;
      color: #555a57;
      background: var(--surface);
      cursor: pointer;
    }

    .dialog-button.primary {
      border-color: var(--primary);
      color: #ffffff;
      background: var(--primary);
    }

    .dialog-button:hover { border-color: #b9c0bc; }
    .dialog-button.primary:hover { background: #0a8965; }

    @media (max-width: 430px) {
      .page { padding-inline: 16px; }
      .preview { min-height: 330px; padding: 28px 16px; }
      .editor-backdrop { padding: 12px; }
      .editor-dialog { max-height: calc(100vh - 24px); }
      .editor-header, .editor-footer { padding-inline: 14px; }
      .editor-body { padding-inline: 14px; }
      .parameter-area { margin-left: 0; }

      .cascade-popover,
      .cascade-popover.opens-left {
        left: 0;
        width: 176px;
        height: 205px;
      }

      .menu-panel { box-shadow: 0 10px 24px rgba(25, 38, 32, 0.1); }
      .process-panel,
      .opens-left .process-panel { left: 0; }

      .parameter-panel,
      .opens-left .parameter-panel {
        top: 105px;
        left: 0;
        width: 176px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="demo" aria-labelledby="page-title">
      <header class="intro">
        <h1 id="page-title">级连选择</h1>
        <p>选择流程节点及其输出参数</p>
      </header>

      <div class="demo-toolbar" aria-label="演示工具">
        <div class="direction-control">
          <span>二级位置</span>
          <div class="segmented" role="group" aria-label="二级选择框位置">
            <button class="direction-button is-active" type="button" data-direction="left" aria-pressed="true">左侧</button>
            <button class="direction-button" type="button" data-direction="right" aria-pressed="false">右侧</button>
            <button class="direction-button" type="button" data-direction="auto" aria-pressed="false">自动</button>
          </div>
        </div>
        <button class="text-button" id="editDataButton" type="button">编辑列表数据</button>
      </div>

      <div class="preview">
        <div>
          <div class="cascade" id="cascade">
            <div class="cascade-trigger" id="cascadeTrigger" role="combobox" tabindex="0"
              aria-haspopup="listbox" aria-expanded="false" aria-controls="cascadePopover">
              <span class="selection-chip" id="selectionChip">
                <span class="selection-source">
                  <span class="doc-icon is-compact" aria-hidden="true">
                    <svg viewBox="0 0 16 16" fill="none">
                      <path fill="#6561FF" d="M6.691 0h2.618c2.202 0 3.093.248 3.963.712.869.465 1.551 1.147 2.016 2.016.464.87.712 1.761.712 3.963V9.31c0 2.202-.248 3.093-.712 3.963a4.85 4.85 0 0 1-2.016 2.016c-.87.464-1.761.712-3.963.712H6.69c-2.202 0-3.093-.248-3.963-.712a4.85 4.85 0 0 1-2.016-2.016C.248 12.402 0 11.511 0 9.309V6.69c0-2.202.248-3.093.712-3.963A4.85 4.85 0 0 1 2.728.712C3.598.248 4.489 0 6.691 0Z"/>
                      <g transform="translate(1.6 1.6)">
                        <path fill="#FFF" d="M4.321 1.067h2.078L6.4 2.749c0 .658.058 1.022.219 1.369l.058.115c.189.354.47.634.823.824.384.205.754.276 1.484.276l1.682-.001v4.213c0 .761-.079 1.037-.228 1.315a1.55 1.55 0 0 1-.644.645c-.279.149-.555.228-1.315.228H4.32c-.76 0-1.037-.079-1.315-.228a1.55 1.55 0 0 1-.645-.645c-.148-.278-.228-.554-.228-1.315v-6.29c0-.761.08-1.037.228-1.315a1.55 1.55 0 0 1 .645-.645c.278-.148.554-.228 1.315-.228Zm4.212 7.466H4.267a.533.533 0 1 0 0 1.067h4.266a.533.533 0 1 0 0-1.067Zm0-2.133H4.267a.533.533 0 1 0 0 1.067h4.266a.533.533 0 1 0 0-1.067Zm-.963-5.333c.147.003.212.01.282.027.085.02.16.05.233.096.074.047.133.095.289.251l1.919 1.918c.156.156.204.216.25.29.047.073.077.148.096.232.02.085.028.161.028.381l-1.683.005c-.512 0-.728-.032-.918-.12l-.063-.031a.984.984 0 0 1-.386-.386c-.111-.209-.15-.412-.15-.981V1.067Z"/>
                      </g>
                    </svg>
                  </span>
                  <span class="selection-primary" id="selectionPrimary">候选人...</span>
                </span>
                <span class="selection-secondary" id="selectionSecondary">-员工ID</span>
                <button class="clear-button" id="clearButton" type="button" aria-label="清除选择" title="清除选择">
                  <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M6 6 8 8m0 0 2 2M8 8 6 10m2-2 2-2" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </span>
              <span class="selection-placeholder" id="selectionPlaceholder" hidden>请选择流程参数</span>
              <button class="settings-button" id="settingsButton" type="button" aria-label="设置" title="设置">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M8.65 2.4h2.7l.45 1.65c.48.17.93.42 1.32.76l1.65-.45 1.35 2.34-1.2 1.2c.05.25.08.52.08.8s-.03.55-.08.8l1.2 1.2-1.35 2.34-1.65-.45c-.39.34-.84.59-1.32.76L11.35 15h-2.7l-.45-1.65a5.2 5.2 0 0 1-1.32-.76l-1.65.45-1.35-2.34 1.2-1.2A4 4 0 0 1 5 8.7c0-.28.03-.55.08-.8l-1.2-1.2 1.35-2.34 1.65.45c.39-.34.84-.59 1.32-.76l.45-1.65Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                  <circle cx="10" cy="8.7" r="2.2" stroke="currentColor" stroke-width="1.5"/>
                </svg>
              </button>
            </div>

            <div class="cascade-popover" id="cascadePopover" role="group" aria-label="级连选项">
              <div class="menu-panel process-panel" id="processPanel" role="listbox" aria-label="流程节点"></div>
              <div class="menu-panel parameter-panel" id="parameterPanel" role="listbox" aria-label="节点参数"></div>
            </div>
          </div>
          <div class="status" id="status" aria-live="polite">已选择：候选人资质审批 / 员工ID</div>
        </div>
      </div>
    </section>
  </main>

  <!-- 演示页外部数据编辑器：不属于级连选择组件 -->
  <div class="editor-backdrop" id="editorBackdrop" hidden>
    <section class="editor-dialog" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <header class="editor-header">
        <div>
          <h2 class="editor-title" id="editorTitle">编辑级连列表</h2>
          <p class="editor-subtitle">可修改、新增或删除一级和二级选项</p>
        </div>
        <button class="dialog-close" id="editorClose" type="button" aria-label="关闭">×</button>
      </header>

      <div class="editor-body">
        <div class="editor-toolbar">
          <span class="editor-count" id="editorCount"></span>
          <button class="text-button" id="addProcessButton" type="button">+ 添加一级</button>
        </div>
        <div class="editor-list" id="editorList"></div>
      </div>

      <footer class="editor-footer">
        <button class="dialog-button" id="editorCancel" type="button">取消</button>
        <button class="dialog-button primary" id="editorSave" type="button">保存并应用</button>
      </footer>
    </section>
  </div>

  <script>
    (() => {
      let data = [
        {
          id: "qualification",
          label: "候选人资质审批",
          shortLabel: "候选人...",
          parameters: [
            { id: "employee-id", label: "员工ID", type: "num" },
            { id: "employee-name", label: "员工姓名", type: "str" },
            { id: "candidate-code", label: "候选人编号", type: "str" }
          ]
        },
        {
          id: "offer-confirm",
          label: "Offer内容确认",
          shortLabel: "Offer...",
          parameters: [
            { id: "offer-id", label: "Offer ID", type: "num" },
            { id: "position-name", label: "职位名称", type: "str" },
            { id: "salary-plan", label: "薪资方案", type: "str" }
          ]
        },
        {
          id: "offer-notice",
          label: "发送 Offer通知",
          shortLabel: "发送...",
          parameters: [
            { id: "send-status", label: "发送状态", type: "str" },
            { id: "receiver", label: "接收人", type: "str" },
            { id: "send-time", label: "发送时间", type: "str" }
          ]
        }
      ];

      const cascade = document.getElementById("cascade");
      const trigger = document.getElementById("cascadeTrigger");
      const popover = document.getElementById("cascadePopover");
      const processPanel = document.getElementById("processPanel");
      const parameterPanel = document.getElementById("parameterPanel");
      const selectionChip = document.getElementById("selectionChip");
      const selectionPrimary = document.getElementById("selectionPrimary");
      const selectionSecondary = document.getElementById("selectionSecondary");
      const selectionPlaceholder = document.getElementById("selectionPlaceholder");
      const clearButton = document.getElementById("clearButton");
      const settingsButton = document.getElementById("settingsButton");
      const status = document.getElementById("status");
      const directionButtons = [...document.querySelectorAll("[data-direction]")];
      const editorBackdrop = document.getElementById("editorBackdrop");
      const editorClose = document.getElementById("editorClose");
      const editorCancel = document.getElementById("editorCancel");
      const editorSave = document.getElementById("editorSave");
      const editorList = document.getElementById("editorList");
      const editorCount = document.getElementById("editorCount");
      const addProcessButton = document.getElementById("addProcessButton");
      const editDataButton = document.getElementById("editDataButton");

      let isOpen = false;
      let activeProcess = 0;
      let selected = { process: 0, parameter: 0 };
      let focusColumn = "process";
      let focusIndex = 0;
      let directionMode = "left";
      let draftData = [];

      const docIcon = `
        <span class="doc-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none">
            <path fill="#6561FF" d="M6.691 0h2.618c2.202 0 3.093.248 3.963.712.869.465 1.551 1.147 2.016 2.016.464.87.712 1.761.712 3.963V9.31c0 2.202-.248 3.093-.712 3.963a4.85 4.85 0 0 1-2.016 2.016c-.87.464-1.761.712-3.963.712H6.69c-2.202 0-3.093-.248-3.963-.712a4.85 4.85 0 0 1-2.016-2.016C.248 12.402 0 11.511 0 9.309V6.69c0-2.202.248-3.093.712-3.963A4.85 4.85 0 0 1 2.728.712C3.598.248 4.489 0 6.691 0Z"/>
            <g transform="translate(1.6 1.6)">
              <path fill="#FFF" d="M4.321 1.067h2.078L6.4 2.749c0 .658.058 1.022.219 1.369l.058.115c.189.354.47.634.823.824.384.205.754.276 1.484.276l1.682-.001v4.213c0 .761-.079 1.037-.228 1.315a1.55 1.55 0 0 1-.644.645c-.279.149-.555.228-1.315.228H4.32c-.76 0-1.037-.079-1.315-.228a1.55 1.55 0 0 1-.645-.645c-.148-.278-.228-.554-.228-1.315v-6.29c0-.761.08-1.037.228-1.315a1.55 1.55 0 0 1 .645-.645c.278-.148.554-.228 1.315-.228Zm4.212 7.466H4.267a.533.533 0 1 0 0 1.067h4.266a.533.533 0 1 0 0-1.067Zm0-2.133H4.267a.533.533 0 1 0 0 1.067h4.266a.533.533 0 1 0 0-1.067Zm-.963-5.333c.147.003.212.01.282.027.085.02.16.05.233.096.074.047.133.095.289.251l1.919 1.918c.156.156.204.216.25.29.047.073.077.148.096.232.02.085.028.161.028.381l-1.683.005c-.512 0-.728-.032-.918-.12l-.063-.031a.984.984 0 0 1-.386-.386c-.111-.209-.15-.412-.15-.981V1.067Z"/>
            </g>
          </svg>
        </span>`;

      const chevron = (direction) => `
        <svg class="chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="${direction === "left" ? "M9.5 4.5 6 8l3.5 3.5" : "M6.5 4.5 10 8l-3.5 3.5"}"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;

      function cloneData(source) {
        return JSON.parse(JSON.stringify(source));
      }

      function createId(prefix) {
        const randomPart = Math.random().toString(36).slice(2, 8);
        return `${prefix}-${Date.now().toString(36)}-${randomPart}`;
      }

      function createShortLabel(label) {
        const text = label.trim();
        return text.length > 5 ? `${text.slice(0, 3)}...` : text;
      }

      function escapeHTML(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderEditor() {
        const parameterTotal = draftData.reduce((total, item) => total + item.parameters.length, 0);
        editorCount.textContent = `一级 ${draftData.length} 项 · 二级 ${parameterTotal} 项`;

        if (!draftData.length) {
          editorList.innerHTML = `<div class="empty-editor-row">暂无选项，点击“添加一级”开始编辑</div>`;
          return;
        }

        editorList.innerHTML = draftData.map((process, processIndex) => {
          const parameterRows = process.parameters.length
            ? process.parameters.map((parameter, parameterIndex) => `
                <div class="parameter-row">
                  <input class="editor-input" type="text" value="${escapeHTML(parameter.label)}"
                    data-field="parameter-label" data-process-index="${processIndex}" data-parameter-index="${parameterIndex}"
                    aria-label="二级选项内容">
                  <select class="editor-select" data-field="parameter-type"
                    data-process-index="${processIndex}" data-parameter-index="${parameterIndex}"
                    aria-label="二级选项类型">
                    ${["str", "num", "bool", "obj"].map((type) =>
                      `<option value="${type}"${parameter.type === type ? " selected" : ""}>${type}</option>`
                    ).join("")}
                  </select>
                  <button class="row-delete" type="button" data-action="delete-parameter"
                    data-process-index="${processIndex}" data-parameter-index="${parameterIndex}"
                    aria-label="删除二级选项">×</button>
                </div>`).join("")
            : `<div class="empty-editor-row">暂无二级选项</div>`;

          return `
            <section class="level-card">
              <div class="level-header">
                <span class="level-number">${processIndex + 1}</span>
                <input class="editor-input" type="text" value="${escapeHTML(process.label)}"
                  data-field="process-label" data-process-index="${processIndex}" aria-label="一级选项内容">
                <button class="row-delete" type="button" data-action="delete-process"
                  data-process-index="${processIndex}" aria-label="删除一级选项">×</button>
              </div>
              <div class="parameter-area">
                <div class="parameter-toolbar">
                  <span class="parameter-count">二级列表（${process.parameters.length}）</span>
                  <button class="text-button" type="button" data-action="add-parameter"
                    data-process-index="${processIndex}">+ 添加二级</button>
                </div>
                <div class="parameter-list">${parameterRows}</div>
              </div>
            </section>`;
        }).join("");
      }

      function openEditor() {
        draftData = cloneData(data);
        renderEditor();
        editorBackdrop.hidden = false;
        document.body.style.overflow = "hidden";
        requestAnimationFrame(() => editorList.querySelector("input")?.focus());
      }

      function closeEditor() {
        editorBackdrop.hidden = true;
        document.body.style.overflow = "";
        editDataButton.focus();
      }

      function saveEditor() {
        const selectedProcessId = selected ? data[selected.process]?.id : null;
        const selectedParameterId = selected
          ? data[selected.process]?.parameters[selected.parameter]?.id
          : null;

        data = draftData.map((process, processIndex) => {
          const label = process.label.trim() || `未命名一级 ${processIndex + 1}`;
          return {
            id: process.id || createId("process"),
            label,
            shortLabel: createShortLabel(label),
            parameters: process.parameters.map((parameter, parameterIndex) => ({
              id: parameter.id || createId("parameter"),
              label: parameter.label.trim() || `未命名二级 ${parameterIndex + 1}`,
              type: parameter.type || "str"
            }))
          };
        });

        const preservedProcessIndex = data.findIndex((item) => item.id === selectedProcessId);
        const preservedParameterIndex = preservedProcessIndex >= 0
          ? data[preservedProcessIndex].parameters.findIndex((item) => item.id === selectedParameterId)
          : -1;

        if (preservedProcessIndex >= 0 && preservedParameterIndex >= 0) {
          selected = { process: preservedProcessIndex, parameter: preservedParameterIndex };
          activeProcess = preservedProcessIndex;
        } else {
          selected = null;
          activeProcess = Math.min(activeProcess, Math.max(0, data.length - 1));
        }

        focusColumn = "process";
        focusIndex = activeProcess;
        setOpen(false);
        renderSelection();
        renderMenus();
        closeEditor();

        const parameterTotal = data.reduce((total, item) => total + item.parameters.length, 0);
        status.textContent = `已更新：${data.length} 个一级选项，${parameterTotal} 个二级选项`;
      }

      function layoutPopover() {
        const rect = trigger.getBoundingClientRect();
        const autoNeedsLeft = rect.left + 326 > window.innerWidth - 16;
        const needsLeft = window.innerWidth > 430 && (
          directionMode === "left" || (directionMode === "auto" && autoNeedsLeft)
        );
        popover.classList.toggle("opens-left", needsLeft);
      }

      function setDirection(mode) {
        directionMode = mode;
        directionButtons.forEach((button) => {
          const isActive = button.dataset.direction === mode;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-pressed", String(isActive));
        });
        layoutPopover();
        renderMenus();
        if (!isOpen) setOpen(true);
      }

      function renderMenus() {
        const opensLeft = popover.classList.contains("opens-left");

        if (!data.length) {
          processPanel.innerHTML = `<div class="empty-editor-row">暂无一级选项</div>`;
          parameterPanel.innerHTML = `<div class="empty-editor-row">暂无二级选项</div>`;
          return;
        }

        activeProcess = Math.min(activeProcess, data.length - 1);

        processPanel.innerHTML = data.map((item, index) => `
          <button class="menu-item${activeProcess === index ? " is-active" : ""}${focusColumn === "process" && focusIndex === index ? " is-focused" : ""}"
            type="button" role="option" aria-selected="${activeProcess === index}" data-process="${index}">
            ${opensLeft ? chevron("left") : ""}
            ${docIcon}
            <span class="menu-label">${escapeHTML(item.label)}</span>
            ${opensLeft ? "" : chevron("right")}
          </button>`).join("");

        const parameters = data[activeProcess].parameters;
        parameterPanel.innerHTML = parameters.length
          ? parameters.map((item, index) => `
              <button class="menu-item${selected && selected.process === activeProcess && selected.parameter === index ? " is-active" : ""}${focusColumn === "parameter" && focusIndex === index ? " is-focused" : ""}"
                type="button" role="option" aria-selected="${Boolean(selected && selected.process === activeProcess && selected.parameter === index)}" data-parameter="${index}">
                <span class="menu-label">${escapeHTML(item.label)}</span>
                <span class="type-tag">${escapeHTML(item.type)}</span>
              </button>`).join("")
          : `<div class="empty-editor-row">暂无二级选项</div>`;
      }

      function renderSelection() {
        const process = selected ? data[selected.process] : null;
        const parameter = process ? process.parameters[selected.parameter] : null;

        if (!selected || !process || !parameter) {
          selected = null;
          selectionChip.hidden = true;
          selectionPlaceholder.hidden = false;
          status.textContent = "尚未选择";
          return;
        }

        selectionChip.hidden = false;
        selectionPlaceholder.hidden = true;
        selectionPrimary.textContent = process.shortLabel;
        selectionSecondary.textContent = `-${parameter.label}`;
        status.textContent = `已选择：${process.label} / ${parameter.label}`;
      }

      function setOpen(next) {
        isOpen = next;
        cascade.classList.toggle("is-open", isOpen);
        trigger.setAttribute("aria-expanded", String(isOpen));
        if (isOpen) {
          layoutPopover();
          renderMenus();
        }
      }

      function selectProcess(index) {
        if (!data[index]) return;
        activeProcess = index;
        focusColumn = "process";
        focusIndex = index;
        renderMenus();
      }

      function selectParameter(index) {
        if (!data[activeProcess]?.parameters[index]) return;
        selected = { process: activeProcess, parameter: index };
        focusColumn = "parameter";
        focusIndex = index;
        renderSelection();
        renderMenus();
      }

      trigger.addEventListener("click", (event) => {
        if (event.target.closest("#clearButton") || event.target.closest("#settingsButton")) return;
        setOpen(!isOpen);
      });

      clearButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        selected = null;
        renderSelection();
        renderMenus();
      });

      settingsButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        cascade.dispatchEvent(new CustomEvent("cascade-settings"));
      });

      cascade.addEventListener("cascade-settings", () => {
        status.textContent = "组件设置事件已触发";
      });

      editDataButton.addEventListener("click", openEditor);

      addProcessButton.addEventListener("click", () => {
        draftData.push({
          id: createId("process"),
          label: `新建一级选项 ${draftData.length + 1}`,
          shortLabel: "新建...",
          parameters: [{
            id: createId("parameter"),
            label: "新建二级选项",
            type: "str"
          }]
        });
        renderEditor();
        editorList.querySelector(".level-card:last-child .level-header input")?.focus();
      });

      editorList.addEventListener("input", (event) => {
        const field = event.target.dataset.field;
        const processIndex = Number(event.target.dataset.processIndex);
        const parameterIndex = Number(event.target.dataset.parameterIndex);
        if (!draftData[processIndex]) return;

        if (field === "process-label") {
          draftData[processIndex].label = event.target.value;
        } else if (field === "parameter-label" && draftData[processIndex].parameters[parameterIndex]) {
          draftData[processIndex].parameters[parameterIndex].label = event.target.value;
        }
      });

      editorList.addEventListener("change", (event) => {
        if (event.target.dataset.field !== "parameter-type") return;
        const processIndex = Number(event.target.dataset.processIndex);
        const parameterIndex = Number(event.target.dataset.parameterIndex);
        const parameter = draftData[processIndex]?.parameters[parameterIndex];
        if (parameter) parameter.type = event.target.value;
      });

      editorList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-action]");
        if (!button) return;
        const processIndex = Number(button.dataset.processIndex);
        const parameterIndex = Number(button.dataset.parameterIndex);

        if (button.dataset.action === "delete-process") {
          draftData.splice(processIndex, 1);
        } else if (button.dataset.action === "add-parameter" && draftData[processIndex]) {
          draftData[processIndex].parameters.push({
            id: createId("parameter"),
            label: `新建二级选项 ${draftData[processIndex].parameters.length + 1}`,
            type: "str"
          });
        } else if (button.dataset.action === "delete-parameter" && draftData[processIndex]) {
          draftData[processIndex].parameters.splice(parameterIndex, 1);
        }

        renderEditor();
      });

      editorClose.addEventListener("click", closeEditor);
      editorCancel.addEventListener("click", closeEditor);
      editorSave.addEventListener("click", saveEditor);

      editorBackdrop.addEventListener("click", (event) => {
        if (event.target === editorBackdrop) closeEditor();
      });

      directionButtons.forEach((button) => {
        button.addEventListener("click", () => setDirection(button.dataset.direction));
      });

      processPanel.addEventListener("click", (event) => {
        const item = event.target.closest("[data-process]");
        if (item) selectProcess(Number(item.dataset.process));
      });

      parameterPanel.addEventListener("click", (event) => {
        const item = event.target.closest("[data-parameter]");
        if (item) selectParameter(Number(item.dataset.parameter));
      });

      trigger.addEventListener("keydown", (event) => {
        const keys = ["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight", "Enter", "Escape"];
        if (!keys.includes(event.key)) return;
        event.preventDefault();

        if (!isOpen && event.key !== "Escape") {
          setOpen(true);
          return;
        }

        if (event.key === "Escape") {
          setOpen(false);
          return;
        }

        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          if (!data.length) return;
          const opensLeft = popover.classList.contains("opens-left");
          const movesToParameter = opensLeft
            ? event.key === "ArrowLeft"
            : event.key === "ArrowRight";
          focusColumn = movesToParameter ? "parameter" : "process";
          focusIndex = movesToParameter ? 0 : activeProcess;
        } else if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          const count = focusColumn === "process"
            ? data.length
            : (data[activeProcess]?.parameters.length || 0);
          if (!count) return;
          focusIndex = (focusIndex + (event.key === "ArrowDown" ? 1 : -1) + count) % count;
        } else if (event.key === "Enter") {
          if (focusColumn === "process") selectProcess(focusIndex);
          else selectParameter(focusIndex);
        }

        renderMenus();
      });

      document.addEventListener("click", (event) => {
        if (!cascade.contains(event.target)) setOpen(false);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !editorBackdrop.hidden) closeEditor();
      });

      window.addEventListener("resize", () => {
        if (isOpen) {
          layoutPopover();
          renderMenus();
        }
      });

      renderSelection();
    })();
  </script>
</body>
</html>
