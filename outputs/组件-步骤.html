<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组件 · 步骤</title>
  <style>
    /*
      还原依据：组件-步骤.sketch
      - 角色：桌面端业务流程中的横向步骤导航
      - 视觉：中性灰阶，当前步骤使用品牌绿色
      - 容量：默认 5 步，容器最大宽度 1010 px，步骤等分可用宽度，间距固定 10 px
      - 交互：点击任一步，可预览对应的完成 / 进行中 / 未开始状态
    */

    @font-face {
      font-family: "Source Han Sans SC Local";
      src: url("./SourceHanSansSC-Bold.otf") format("opentype");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --canvas: #f1f4f2;
      --surface: #fbfaf8;
      --selected-surface: #e0f4ef;
      --ink: #29282d;
      --step-complete: #363636;
      --step-current: #0c9b72;
      --step-pending: #eeeeee;
      --step-pending-text: #aaaaaa;
      --step-white: #ffffff;
      --step-gap: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 32px;
      color: var(--ink);
      background:
        linear-gradient(rgba(41, 40, 45, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(41, 40, 45, 0.035) 1px, transparent 1px),
        var(--canvas);
      background-size: 24px 24px;
      font-family: "Source Han Sans SC Local", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
    }

    .demo {
      display: grid;
      width: min(1068px, 100%);
      min-width: 0;
      justify-items: center;
      gap: 18px;
    }

    .component-frame {
      width: 100%;
      min-width: 0;
      padding: 28px;
      border: 1px solid rgba(41, 40, 45, 0.08);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow:
        0 1px 1px rgba(41, 40, 45, 0.04),
        0 18px 50px rgba(41, 40, 45, 0.08);
    }

    .component-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 20px;
    }

    .control-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      padding: 0 14px;
      border: 0;
      border-radius: 10px;
      color: #77767b;
      background: var(--surface);
      font-family: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 20px;
      cursor: pointer;
      appearance: none;
      transition:
        color 160ms cubic-bezier(0.22, 1, 0.36, 1),
        background-color 160ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 120ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .control-button--add {
      color: var(--step-current);
      background: var(--selected-surface);
    }

    .control-button:hover:not(:disabled) {
      background: #edf1ef;
    }

    .control-button--add:hover:not(:disabled) {
      background: #d4eee7;
    }

    .control-button:active:not(:disabled) {
      transform: scale(0.985);
    }

    .control-button:focus-visible {
      outline: none;
      box-shadow:
        0 0 0 2px var(--surface),
        0 0 0 4px var(--step-current);
    }

    .control-button:disabled {
      color: #c7c7c7;
      background: #f5f5f4;
      cursor: not-allowed;
    }

    .control-icon {
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
    }

    .stepper-viewport {
      width: 100%;
      min-width: 0;
    }

    .stepper {
      display: flex;
      gap: var(--step-gap);
      width: 100%;
      height: 44px;
    }

    .step {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      width: auto;
      height: 44px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }

    .step__content {
      display: flex;
      align-items: center;
      width: 100%;
      height: 30px;
    }

    .step__marker {
      position: relative;
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }

    .step__number,
    .step__check {
      position: absolute;
      inset: 2px;
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
    }

    .step__number {
      font-size: 12px;
      font-weight: 700;
      line-height: 20px;
      text-align: center;
    }

    .step__check svg {
      display: block;
      width: 20px;
      height: 20px;
    }

    .step__label {
      flex: 1 1 auto;
      min-width: 0;
      width: auto;
      height: 30px;
      margin-left: 10px;
      overflow: hidden;
      font-size: 16px;
      font-weight: 700;
      line-height: 30px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .step__bar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
    }

    .step[data-state="complete"] .step__marker,
    .step[data-state="complete"] .step__bar {
      background: var(--step-complete);
    }

    .step[data-state="complete"] .step__label {
      color: var(--step-complete);
    }

    .step[data-state="current"] .step__marker,
    .step[data-state="current"] .step__bar {
      background: var(--step-current);
    }

    .step[data-state="current"] .step__number {
      color: var(--step-white);
    }

    .step[data-state="current"] .step__label {
      color: var(--step-current);
    }

    .step[data-state="pending"] .step__marker,
    .step[data-state="pending"] .step__bar {
      background: var(--step-pending);
    }

    .step[data-state="pending"] .step__number,
    .step[data-state="pending"] .step__label {
      color: var(--step-pending-text);
    }

    .step:focus-visible {
      outline: none;
      border-radius: 4px;
      box-shadow:
        0 0 0 2px var(--surface),
        0 0 0 4px var(--step-current);
    }

    .hint {
      margin: 0;
      color: rgba(41, 40, 45, 0.54);
      font-family: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 12px;
      font-weight: 400;
      line-height: 18px;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }

      .component-frame {
        padding: 20px;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .step__marker,
      .step__bar,
      .step__label {
        transition: color 160ms ease, background-color 160ms ease;
      }
    }
  </style>
</head>
<body>
  <main class="demo">
    <section class="component-frame" aria-label="步骤组件演示">
      <div class="component-toolbar" aria-label="步骤管理">
        <button class="control-button control-button--add" id="add-step" type="button">
          <span class="control-icon" aria-hidden="true">+</span>
          添加步骤
        </button>
        <button class="control-button" id="delete-step" type="button">
          <span class="control-icon" aria-hidden="true">−</span>
          删除当前
        </button>
      </div>
      <div class="stepper-viewport" aria-label="流程步骤预览">
        <div class="stepper" id="stepper" role="list"></div>
      </div>
    </section>
    <p class="hint">点击步骤切换当前进度；添加步骤会追加到末尾，删除当前会移除绿色步骤</p>
    <p class="sr-only" id="step-status" aria-live="polite"></p>
  </main>

  <script>
    let steps = [
      "基础信息",
      "入参配置",
      "处理逻辑",
      "出参配置",
      "预览"
    ];

    let currentStep = 1;
    let nextStepNumber = 6;

    const addStepButton = document.getElementById("add-step");
    const deleteStepButton = document.getElementById("delete-step");
    const stepStatus = document.getElementById("step-status");

    function checkIcon() {
      return `
        <span class="step__check" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 10.2L8.25 13.45L15.25 6.45" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>`;
    }

    function renderStepper() {
      const stepper = document.getElementById("stepper");

      stepper.innerHTML = steps.map((label, index) => {
        const state = index < currentStep
          ? "complete"
          : index === currentStep
            ? "current"
            : "pending";

        const marker = state === "complete"
          ? checkIcon()
          : `<span class="step__number" aria-hidden="true">${index + 1}</span>`;

        const stateText = state === "complete"
          ? "已完成"
          : state === "current"
            ? "进行中"
            : "未开始";

        return `
          <button
            class="step"
            type="button"
            role="listitem"
            data-index="${index}"
            data-state="${state}"
            aria-current="${state === "current" ? "step" : "false"}"
            aria-label="第 ${index + 1} 步：${label}，${stateText}"
          >
            <span class="step__content">
              <span class="step__marker">${marker}</span>
              <span class="step__label">${label}</span>
            </span>
            <span class="step__bar" aria-hidden="true"></span>
          </button>`;
      }).join("");

      deleteStepButton.disabled = steps.length === 1;
    }

    document.getElementById("stepper").addEventListener("click", (event) => {
      const step = event.target.closest(".step");
      if (!step) return;

      currentStep = Number(step.dataset.index);
      renderStepper();
      document.querySelector(`[data-index="${currentStep}"]`).focus();
    });

    addStepButton.addEventListener("click", () => {
      const newLabel = `新步骤 ${nextStepNumber}`;
      nextStepNumber += 1;
      steps.push(newLabel);
      renderStepper();
      stepStatus.textContent = `已添加${newLabel}，当前共 ${steps.length} 个步骤`;
    });

    deleteStepButton.addEventListener("click", () => {
      if (steps.length === 1) return;

      const removedLabel = steps[currentStep];
      steps.splice(currentStep, 1);
      currentStep = Math.min(currentStep, steps.length - 1);
      renderStepper();
      stepStatus.textContent = `已删除${removedLabel}，当前共 ${steps.length} 个步骤`;
    });

    renderStepper();
  </script>
</body>
</html>
