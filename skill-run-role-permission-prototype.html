<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>角色权限配置页 Demo</title>
    <style>
      :root {
        --color-page: #fbfaf8;
        --color-surface: #ffffff;
        --color-surface-soft: #f3faf8;
        --color-surface-softer: #f8fcfa;
        --color-primary: #0c9b72;
        --color-primary-deep: #0a7e5d;
        --color-primary-soft: #e8f8f3;
        --color-text-title: #222222;
        --color-text-main: #2f2f2f;
        --color-text-secondary: #6f6a62;
        --color-text-muted: #aaaaaa;
        --color-border: #e5eae7;
        --color-border-strong: #cee0d6;
        --color-warning: #e07f33;
        --color-warning-soft: #fef0e5;
        --color-danger: #e53e3e;
        --color-danger-soft: #fff4f4;
        --color-disabled-soft: #f4f4f4;
        --shadow-panel: 0 18px 42px rgba(28, 45, 37, 0.06);
        --shadow-float: 0 16px 38px rgba(24, 43, 35, 0.12);
        --radius-sm: 5px;
        --radius-md: 14px;
        --radius-lg: 24px;
        --radius-xl: 28px;
        --control-height: 40px;
        --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
        --font-base: "Source Han Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        --sidebar-width: 292px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at left bottom, rgba(12, 155, 114, 0.12), transparent 22%), var(--color-page);
        color: var(--color-text-main);
        font-family: var(--font-base);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-shell {
        display: grid;
        grid-template-columns: var(--sidebar-width) 1fr;
        min-height: 100vh;
      }

      .sidebar {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 28px;
        padding: 22px 22px 30px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.84) 72%, rgba(232, 248, 243, 0.86) 100%);
        border-right: 1px solid rgba(229, 234, 231, 0.7);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 16px;
        color: #fff;
        font-size: 28px;
        background: linear-gradient(150deg, #139f76, #0c9b72);
        box-shadow: 0 12px 24px rgba(12, 155, 114, 0.24);
      }

      .brand-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--color-text-title);
      }

      .brand-subtitle {
        margin-top: 4px;
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .menu-group-title {
        padding: 0 12px;
        font-size: 13px;
        color: var(--color-text-muted);
      }

      .menu {
        display: grid;
        gap: 8px;
      }

      .menu-item {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 56px;
        padding: 0 18px;
        border-radius: 18px;
        color: var(--color-text-secondary);
        transition: background-color 220ms var(--ease-out-quart), color 220ms var(--ease-out-quart), transform 220ms var(--ease-out-quart);
      }

      .menu-item.active,
      .menu-item:hover {
        background: var(--color-primary-soft);
        color: var(--color-primary);
        transform: translateX(2px);
      }

      .menu-item.active {
        font-weight: 700;
      }

      .menu-icon {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        background: currentColor;
        opacity: 0.2;
      }

      .sidebar-footer {
        margin-top: auto;
        padding: 18px;
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(232, 248, 243, 0.25), rgba(232, 248, 243, 0.8));
      }

      .profile-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: var(--shadow-panel);
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 20px;
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        background: var(--color-primary);
      }

      .profile-name {
        font-size: 16px;
        color: var(--color-text-title);
      }

      .profile-role {
        margin-top: 4px;
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .page-header {
        padding: 28px 34px 18px;
      }

      .page-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .page-title {
        margin: 0;
        font-size: 38px;
        line-height: 1.1;
        color: var(--color-text-title);
      }

      .page-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .status-tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 28px;
        padding: 0 14px;
        border: 1px solid transparent;
        border-radius: 999px;
        font-size: 13px;
        color: var(--color-primary);
        background: var(--color-primary-soft);
        transition: transform 220ms var(--ease-out-quart), opacity 220ms var(--ease-out-quart), background-color 220ms var(--ease-out-quart), color 220ms var(--ease-out-quart);
      }

      .status-tag.disabled {
        color: var(--color-text-secondary);
        background: var(--color-disabled-soft);
      }

      .status-tag.warning {
        color: var(--color-warning);
        background: var(--color-warning-soft);
      }

      .status-tag.hidden {
        opacity: 0;
        transform: translateY(-6px);
        pointer-events: none;
      }

      .content-panel {
        margin: 0 22px 22px;
        border: 1px solid rgba(229, 234, 231, 0.86);
        border-radius: var(--radius-xl);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow-panel);
        overflow: hidden;
      }

      .split-view {
        display: grid;
        grid-template-columns: 336px 1fr;
        min-height: calc(100vh - 138px);
      }

      .left-panel {
        padding: 24px 22px;
        border-right: 1px solid var(--color-border);
        background: linear-gradient(180deg, rgba(251, 253, 252, 0.9), rgba(255, 255, 255, 0.98));
      }

      .panel-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .panel-title,
      .section-title {
        margin: 0;
        font-size: 18px;
        color: var(--color-text-title);
      }

      .count-chip {
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: var(--color-text-secondary);
        background: var(--color-surface-soft);
      }

      .toolbar-stack {
        display: grid;
        gap: 12px;
        margin-bottom: 18px;
      }

      .search-field,
      .field-input,
      .field-select {
        width: 100%;
        height: var(--control-height);
        padding: 0 14px;
        border: 1px solid var(--color-border);
        border-radius: 14px;
        background: #fff;
        color: var(--color-text-main);
        transition: border-color 180ms var(--ease-out-quart), box-shadow 180ms var(--ease-out-quart), transform 180ms var(--ease-out-quart);
      }

      .search-field:focus,
      .field-input:focus,
      .field-select:focus,
      .field-textarea:focus {
        outline: none;
        border-color: rgba(12, 155, 114, 0.46);
        box-shadow: 0 0 0 4px rgba(12, 155, 114, 0.1);
        transform: translateY(-1px);
      }

      .field-input[readonly] {
        background: var(--color-surface-softer);
        color: var(--color-text-secondary);
      }

      .field-textarea {
        width: 100%;
        min-height: 112px;
        padding: 14px;
        border: 1px solid var(--color-border);
        border-radius: 16px;
        background: #fff;
        color: var(--color-text-main);
        resize: vertical;
        transition: border-color 180ms var(--ease-out-quart), box-shadow 180ms var(--ease-out-quart), transform 180ms var(--ease-out-quart);
      }

      .button-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn,
      .icon-btn,
      .tree-toggle,
      .tree-checkbox {
        border: 0;
        background: transparent;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 14px;
        background: #fff;
        color: var(--color-text-main);
        font-weight: 600;
        transition: transform 180ms var(--ease-out-quart), box-shadow 180ms var(--ease-out-quart), border-color 180ms var(--ease-out-quart), background-color 180ms var(--ease-out-quart), color 180ms var(--ease-out-quart);
      }

      .btn:hover:not(:disabled),
      .icon-btn:hover,
      .role-item:hover {
        transform: translateY(-1px);
      }

      .btn:active:not(:disabled),
      .icon-btn:active,
      .role-item:active {
        transform: translateY(0) scale(0.985);
      }

      .btn.primary {
        color: #fff;
        background: var(--color-primary);
        box-shadow: 0 12px 20px rgba(12, 155, 114, 0.2);
      }

      .btn.primary:hover:not(:disabled) {
        background: var(--color-primary-deep);
      }

      .btn.secondary {
        border-color: var(--color-border);
      }

      .btn.secondary:hover:not(:disabled),
      .btn.ghost:hover:not(:disabled) {
        border-color: var(--color-border-strong);
        background: var(--color-surface-soft);
      }

      .btn.danger {
        color: var(--color-danger);
        background: var(--color-danger-soft);
      }

      .btn:disabled {
        opacity: 0.48;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      .role-list {
        display: grid;
        gap: 10px;
      }

      .role-item {
        width: 100%;
        padding: 16px 16px 14px;
        border: 1px solid var(--color-border);
        border-radius: 18px;
        background: #fff;
        text-align: left;
        transition: border-color 180ms var(--ease-out-quart), background-color 180ms var(--ease-out-quart), box-shadow 180ms var(--ease-out-quart), transform 180ms var(--ease-out-quart);
      }

      .role-item.active {
        border-color: rgba(12, 155, 114, 0.24);
        background: var(--color-primary-soft);
        box-shadow: inset 0 0 0 1px rgba(12, 155, 114, 0.1);
      }

      .role-item-name-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .role-name {
        font-size: 15px;
        font-weight: 700;
        color: var(--color-text-title);
      }

      .role-meta {
        margin-top: 8px;
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .empty-state {
        display: grid;
        place-items: center;
        padding: 38px 22px;
        border: 1px dashed var(--color-border);
        border-radius: 18px;
        background: rgba(251, 253, 252, 0.86);
        text-align: center;
      }

      .empty-state.hidden,
      .hidden {
        display: none !important;
      }

      .empty-state-mark {
        width: 52px;
        height: 52px;
        border-radius: 18px;
        background: linear-gradient(180deg, #f3faf8, #e8f8f3);
        margin-bottom: 12px;
      }

      .empty-state-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--color-text-title);
      }

      .empty-state-text {
        margin-top: 6px;
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .right-panel {
        display: grid;
        grid-template-rows: 1fr auto;
        min-width: 0;
      }

      .detail-scroll {
        min-height: 0;
      }

      .section {
        padding: 26px 28px 0;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      .section-actions {
        display: flex;
        gap: 8px;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 40px;
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--color-border);
        border-radius: 12px;
        color: var(--color-text-secondary);
        background: #fff;
        transition: border-color 180ms var(--ease-out-quart), background-color 180ms var(--ease-out-quart), transform 180ms var(--ease-out-quart);
      }

      .icon-btn:hover {
        border-color: var(--color-border-strong);
        background: var(--color-surface-soft);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(240px, 1fr));
        gap: 18px 20px;
      }

      .field {
        display: grid;
        gap: 10px;
      }

      .field.span-2 {
        grid-column: span 2;
      }

      .field-label {
        font-size: 14px;
        font-weight: 600;
        color: var(--color-text-title);
      }

      .inline-alert {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 14px;
        color: var(--color-warning);
        background: var(--color-warning-soft);
        font-size: 13px;
      }

      .permission-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
        gap: 18px;
        min-height: 0;
      }

      .card {
        border: 1px solid var(--color-border);
        border-radius: 22px;
        background: #fff;
      }

      .permission-card,
      .scope-card {
        padding: 18px;
      }

      .tree-root,
      .tree-children {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .tree-node {
        display: grid;
        gap: 4px;
      }

      .tree-row {
        display: grid;
        grid-template-columns: 24px 20px 1fr auto;
        align-items: center;
        gap: 10px;
        min-height: 38px;
        padding: 2px 0;
      }

      .tree-toggle {
        position: relative;
        width: 24px;
        height: 24px;
        border-radius: 10px;
        transition: background-color 180ms var(--ease-out-quart), transform 180ms var(--ease-out-quart);
      }

      .tree-toggle::before {
        content: "";
        position: absolute;
        top: 7px;
        left: 8px;
        width: 8px;
        height: 8px;
        border-right: 2px solid var(--color-text-muted);
        border-bottom: 2px solid var(--color-text-muted);
        transform: rotate(-45deg);
        transition: transform 220ms var(--ease-out-quart), border-color 220ms var(--ease-out-quart);
      }

      .tree-toggle:hover {
        background: var(--color-surface-soft);
      }

      .tree-toggle.collapsed::before {
        transform: rotate(45deg);
      }

      .tree-toggle-placeholder {
        width: 24px;
        height: 24px;
      }

      .tree-checkbox {
        position: relative;
        width: 20px;
        height: 20px;
        border: 1px solid var(--color-border);
        border-radius: 6px;
        background: #fff;
        transition: transform 180ms var(--ease-out-quart), background-color 180ms var(--ease-out-quart), border-color 180ms var(--ease-out-quart), box-shadow 180ms var(--ease-out-quart);
      }

      .tree-checkbox::before,
      .tree-checkbox::after {
        content: "";
        position: absolute;
        opacity: 0;
        transition: opacity 180ms var(--ease-out-quart), transform 180ms var(--ease-out-quart);
      }

      .tree-checkbox.checked,
      .tree-checkbox.partial {
        border-color: var(--color-primary);
      }

      .tree-checkbox.checked {
        background: linear-gradient(180deg, #18a77c, #0c9b72);
        box-shadow: 0 8px 16px rgba(12, 155, 114, 0.18);
      }

      .tree-checkbox.checked::before {
        top: 4px;
        left: 6px;
        width: 5px;
        height: 9px;
        border-right: 2px solid #fff;
        border-bottom: 2px solid #fff;
        opacity: 1;
        transform: rotate(45deg);
      }

      .tree-checkbox.partial {
        background: linear-gradient(180deg, #effaf6, #e0f4ef);
      }

      .tree-checkbox.partial::after {
        top: 8px;
        left: 4px;
        width: 10px;
        height: 2px;
        border-radius: 2px;
        background: var(--color-primary);
        opacity: 1;
      }

      .tree-checkbox:hover {
        transform: scale(1.05);
      }

      .tree-label {
        font-size: 14px;
        color: var(--color-text-main);
      }

      .tree-meta {
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .tree-children {
        padding-left: 24px;
        overflow: hidden;
      }

      .tree-node.collapsed > .tree-children {
        display: none;
      }

      .scope-list {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }

      .scope-item {
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--color-surface-soft);
        transition: transform 180ms var(--ease-out-quart), background-color 180ms var(--ease-out-quart);
      }

      .scope-item:hover {
        transform: translateY(-1px);
      }

      .scope-item strong {
        display: block;
        margin-bottom: 6px;
        color: var(--color-text-title);
        font-size: 14px;
      }

      .scope-item span {
        font-size: 12px;
        color: var(--color-text-secondary);
      }

      .sticky-action-bar {
        position: sticky;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 28px;
        border-top: 1px solid var(--color-border);
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(8px);
      }

      .sticky-tip {
        font-size: 13px;
        color: var(--color-text-muted);
      }

      .sticky-tip strong {
        color: var(--color-primary);
      }

      .toast-stack {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 30;
        display: grid;
        gap: 12px;
      }

      .toast {
        min-width: 240px;
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow-float);
        transform: translateY(-10px);
        opacity: 0;
        animation: toast-in 260ms var(--ease-out-quart) forwards;
      }

      .toast.success {
        border-left: 4px solid var(--color-primary);
      }

      .toast.warning {
        border-left: 4px solid var(--color-warning);
      }

      .toast.danger {
        border-left: 4px solid var(--color-danger);
      }

      .toast-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--color-text-title);
      }

      .toast-text {
        margin-top: 4px;
        font-size: 12px;
        color: var(--color-text-secondary);
      }

      .modal-layer {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(20, 28, 24, 0.36);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms var(--ease-out-quart);
      }

      .modal-layer.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .confirm-dialog {
        width: min(520px, 100%);
        padding: 22px;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: var(--shadow-float);
        transform: translateY(12px) scale(0.98);
        transition: transform 240ms var(--ease-out-quart);
      }

      .modal-layer.visible .confirm-dialog {
        transform: translateY(0) scale(1);
      }

      .confirm-title {
        margin: 0;
        font-size: 20px;
        color: var(--color-text-title);
      }

      .confirm-text {
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.7;
        color: var(--color-text-secondary);
      }

      .confirm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 22px;
      }

      .page-enter {
        animation: page-enter 420ms var(--ease-out-quart);
      }

      @keyframes page-enter {
        from {
          opacity: 0;
          transform: translateY(14px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      @media (max-width: 1100px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          display: none;
        }

        .split-view,
        .permission-layout,
        .form-grid {
          grid-template-columns: 1fr;
        }

        .field.span-2 {
          grid-column: span 1;
        }

        .sticky-action-bar,
        .page-title-row {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell page-enter">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div>
            <div class="brand-title">Smart Service</div>
            <div class="brand-subtitle">角色与权限中心</div>
          </div>
        </div>

        <div>
          <div class="menu-group-title">人员与组织</div>
          <nav class="menu">
            <div class="menu-item"><span class="menu-icon"></span>组织架构</div>

    <pre id="selfTestOutput" class="hidden"></pre>

    <script>
      const scopeLibrary = {
        all: {
          summary: "全部组织与业务数据",
          description: "该角色可以查看并处理系统内全部组织、候选人、职位和 Offer 数据。",

        department: {

          description: "该角色只可访问当前部门名下的数据与记录，适合部门主管或单线审批角色。",
          suggestion: "后续可增加部门路径选择器，用于快速切换组织归属。",
        },
        departmentChildren: {

          description: "该角色可查看本部门及下级组织的数据，适合区域负责人或条线负责人。",
          suggestion: "建议沉淀为 DataScopeCard 组件，统一承载命中组织和权限说明。",

        custom: {

          suggestion: "后续可配合组织树选择弹窗，形成更完整的数据范围配置流程。",
        },
      };

      const initialRoles = [
        {
          id: "recruit-admin",
          name: "招聘管理员",
          code: "CODE_RECRUIT_ADMIN",
          status: "enabled",
          members: 23,
          description: "负责招聘业务中的职位发布、候选人推进、Offer 发起和关键配置权限。",
          scope: "departmentChildren",
          alert: "当前角色已分配给 23 位成员，停用或删除前需要先完成影响评估。",
          permissions: [
            {
              id: "recruit",
              label: "招聘管理",
              expanded: true,
              children: [
                { id: "job-manage", label: "职位管理", checked: true },
                { id: "candidate-manage", label: "候选人管理", checked: true },
                {

                  expanded: true,
                  children: [

                    { id: "offer-revoke", label: "撤回 Offer", checked: true },
                    { id: "offer-export", label: "批量导出 Offer", checked: false },
                  ],

            },
            {

              label: "组织与成员",
              expanded: true,
              children: [
                { id: "org-view", label: "查看组织目录", checked: true },
                { id: "group-edit", label: "编辑处理组", checked: false },
              ],
            },
          ],
        },
        {
          id: "hrbp-lead",
          name: "HRBP 主管",
          code: "CODE_HRBP_LEAD",
          status: "enabled",
          members: 8,
          description: "负责部门级人才策略、任职确认和关键节点审批。",
          scope: "department",
          alert: "该角色通常由业务条线负责人使用，建议保留审批与查看相关的关键能力。",
          permissions: [
            {
              id: "employee-cycle",
              label: "员工生命周期",
              expanded: true,
              children: [
                { id: "employee-view", label: "查看员工档案", checked: true },
                { id: "employee-approve", label: "审批调岗流程", checked: true },
                { id: "employee-export", label: "导出在职名单", checked: false },
              ],
            },
            {
              id: "performance",
              label: "绩效与发展",
              expanded: false,
              children: [
                { id: "perf-view", label: "查看绩效档案", checked: true },
                { id: "perf-adjust", label: "调整绩效校准结果", checked: false },
              ],
            },
          ],
        },
        {
          id: "org-admin",
          name: "组织管理员",
          code: "CODE_ORG_ADMIN",
          status: "enabled",
          members: 5,
          description: "维护组织树、岗位映射和部门负责人的配置规则。",
          scope: "all",
          alert: "该角色掌握组织结构配置权限，建议仅分配给平台侧管理员。",
          permissions: [
            {
              id: "org-config",
              label: "组织配置",
              expanded: true,
              children: [
                { id: "org-create", label: "新建组织", checked: true },
                { id: "org-edit", label: "编辑组织", checked: true },
                { id: "org-delete", label: "删除组织", checked: false },
              ],
            },
            {
              id: "member-config",
              label: "成员配置",
              expanded: true,
              children: [
                { id: "member-import", label: "导入成员", checked: true },
                { id: "member-transfer", label: "成员转移", checked: true },
                { id: "member-export", label: "导出成员列表", checked: true },
              ],
            },
          ],
        },
        {
          id: "ssc-visitor",
          name: "共享服务访客",
          code: "CODE_SSC_VISITOR",
          status: "disabled",
          members: 31,
          description: "用于只读访问共享服务数据，不允许执行编辑或审批。",
          scope: "custom",
          alert: "该角色处于停用状态，成员登录后仅保留已缓存的只读查看能力。",
          permissions: [
            {
              id: "visitor-root",
              label: "只读访问",
              expanded: true,
              children: [
                { id: "visitor-dashboard", label: "查看首页概览", checked: true },
                { id: "visitor-logs", label: "查看审计日志", checked: false },
              ],
            },
          ],
        },
      ];

      const state = {
        roles: clone(initialRoles),
        selectedRoleId: initialRoles[0].id,
        workingRole: clone(initialRoles[0]),
        filter: "",
        pendingAction: null,
      };

      const refs = {
        roleSearchInput: document.getElementById("roleSearchInput"),
        newRoleBtn: document.getElementById("newRoleBtn"),
        exportBtn: document.getElementById("exportBtn"),
        roleList: document.getElementById("roleList"),
        roleListEmpty: document.getElementById("roleListEmpty"),
        roleCountChip: document.getElementById("roleCountChip"),
        roleStatusTag: document.getElementById("roleStatusTag"),
        dirtyTag: document.getElementById("dirtyTag"),
        detailEmpty: document.getElementById("detailEmpty"),
        detailView: document.getElementById("detailView"),
        roleNameInput: document.getElementById("roleNameInput"),
        roleCodeInput: document.getElementById("roleCodeInput"),
        roleStatusSelect: document.getElementById("roleStatusSelect"),
        roleMemberInput: document.getElementById("roleMemberInput"),
        roleDescriptionInput: document.getElementById("roleDescriptionInput"),
        roleAlert: document.getElementById("roleAlert"),
        permissionTree: document.getElementById("permissionTree"),
        permissionEmpty: document.getElementById("permissionEmpty"),
        expandAllBtn: document.getElementById("expandAllBtn"),
        collapseAllBtn: document.getElementById("collapseAllBtn"),
        scopeSelect: document.getElementById("scopeSelect"),
        scopeTitle: document.getElementById("scopeTitle"),
        scopeSummary: document.getElementById("scopeSummary"),
        scopeDescription: document.getElementById("scopeDescription"),
        scopeSuggestion: document.getElementById("scopeSuggestion"),
        stickyTip: document.getElementById("stickyTip"),
        cancelBtn: document.getElementById("cancelBtn"),
        deleteBtn: document.getElementById("deleteBtn"),
        saveBtn: document.getElementById("saveBtn"),
        toastStack: document.getElementById("toastStack"),
        modalLayer: document.getElementById("modalLayer"),
        confirmTitle: document.getElementById("confirmTitle"),
        confirmText: document.getElementById("confirmText"),
        modalCancelBtn: document.getElementById("modalCancelBtn"),
        modalConfirmBtn: document.getElementById("modalConfirmBtn"),
      };

      function clone(data) {
        return JSON.parse(JSON.stringify(data));
      }

      function getRoleById(roleId) {
        return state.roles.find((role) => role.id === roleId) || null;
      }

      function getSelectedSavedRole() {
        return getRoleById(state.selectedRoleId);
      }

      function normalizeRole(role) {
        return {
          name: role.name,
          code: role.code,
          status: role.status,
          members: role.members,
          description: role.description,
          scope: role.scope,
          alert: role.alert,
          permissions: role.permissions,
        };
      }

      function getPermissionState(node) {
        if (!node.children || !node.children.length) {
          return node.checked ? "checked" : "unchecked";
        }
        const childStates = node.children.map(getPermissionState);
        const allChecked = childStates.every((item) => item === "checked");
        const allUnchecked = childStates.every((item) => item === "unchecked");
        if (allChecked) {
          return "checked";
        }
        if (allUnchecked) {
          return "unchecked";
        }
        return "partial";
      }

      function countLeafPermissions(nodes) {
        return nodes.reduce((sum, node) => {
          if (node.children && node.children.length) {
            return sum + countLeafPermissions(node.children);
          }
          return sum + (node.checked ? 1 : 0);
        }, 0);
      }

      function findPermissionNode(nodes, id) {
        for (const node of nodes) {
          if (node.id === id) {
            return node;
          }
          if (node.children && node.children.length) {
            const found = findPermissionNode(node.children, id);
            if (found) {
              return found;
            }
          }
        }
        return null;
      }

      function setSubtreeChecked(node, checked) {
        if (node.children && node.children.length) {
          node.children.forEach((child) => setSubtreeChecked(child, checked));
        } else {
          node.checked = checked;
        }
      }

      function setAllExpanded(nodes, expanded) {
        nodes.forEach((node) => {
          if (node.children && node.children.length) {
            node.expanded = expanded;
            setAllExpanded(node.children, expanded);
          }
        });
      }

      function getChangeCount() {
        const saved = getSelectedSavedRole();
        if (!saved || !state.workingRole) {
          return 0;
        }
        let count = 0;
        if (saved.name !== state.workingRole.name) count += 1;
        if (saved.code !== state.workingRole.code) count += 1;
        if (saved.status !== state.workingRole.status) count += 1;
        if (saved.description !== state.workingRole.description) count += 1;
        if (saved.scope !== state.workingRole.scope) count += 1;
        if (saved.alert !== state.workingRole.alert) count += 1;
        if (JSON.stringify(saved.permissions) !== JSON.stringify(state.workingRole.permissions)) count += 1;
        return count;
      }

      function isDirty() {
        return getChangeCount() > 0;
      }

      function getStatusLabel(status) {
        return status === "disabled" ? "已停用" : "已启用";
      }

      function getRoleBadgeClass(status) {
        return status === "disabled" ? "status-tag disabled" : "status-tag";
      }

      function updateTopTags() {
        if (!state.workingRole) {
          refs.roleStatusTag.textContent = "未选择角色";
          refs.roleStatusTag.className = "status-tag disabled";
          refs.dirtyTag.classList.add("hidden");
          return;
        }
        refs.roleStatusTag.textContent = getStatusLabel(state.workingRole.status);
        refs.roleStatusTag.className = getRoleBadgeClass(state.workingRole.status);
        refs.dirtyTag.classList.toggle("hidden", !isDirty());
      }

      function updateStickyBar() {
        const dirty = isDirty();
        const changes = getChangeCount();
        refs.cancelBtn.disabled = !dirty;
        refs.saveBtn.disabled = !dirty;
        if (!state.workingRole) {
          refs.deleteBtn.disabled = true;
          refs.stickyTip.textContent = "当前没有可编辑角色。";
          return;
        }
        refs.deleteBtn.disabled = false;
        if (dirty) {
          refs.stickyTip.innerHTML = `已修改 <strong>${changes}</strong> 处配置，保存后将立即影响该角色成员的可见权限。`;
        } else {
          refs.stickyTip.textContent = "当前没有未保存修改。";
        }
      }

      function renderRoleList() {
        refs.roleList.innerHTML = "";
        const keyword = state.filter.trim().toLowerCase();
        const filtered = state.roles.filter((role) => {
          if (!keyword) return true;
          return role.name.toLowerCase().includes(keyword) || role.code.toLowerCase().includes(keyword);
        });
        refs.roleCountChip.textContent = keyword ? `${filtered.length} / ${state.roles.length} 个角色` : `${state.roles.length} 个角色`;
        refs.roleListEmpty.classList.toggle("hidden", filtered.length > 0);

        filtered.forEach((role) => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = `role-item${role.id === state.selectedRoleId ? " active" : ""}`;
          item.dataset.roleId = role.id;
          item.innerHTML = `
            <div class="role-item-name-row">
              <div class="role-name">${role.name}</div>
              <span class="${getRoleBadgeClass(role.status)}">${getStatusLabel(role.status)}</span>
            </div>
            <div class="role-meta">${role.code} · ${role.members} 人</div>
          `;
          item.addEventListener("click", () => requestRoleSwitch(role.id));
          refs.roleList.appendChild(item);
        });
      }

      function renderForm() {
        if (!state.workingRole) {
          refs.detailView.classList.add("hidden");
          refs.detailEmpty.classList.remove("hidden");
          return;
        }
        refs.detailView.classList.remove("hidden");
        refs.detailEmpty.classList.add("hidden");

        refs.roleNameInput.value = state.workingRole.name;
        refs.roleCodeInput.value = state.workingRole.code;
        refs.roleStatusSelect.value = state.workingRole.status;
        refs.roleMemberInput.value = `${state.workingRole.members} 人`;
        refs.roleDescriptionInput.value = state.workingRole.description;
        refs.roleAlert.textContent = state.workingRole.alert;
      }

      function renderScopeCard() {
        if (!state.workingRole) return;
        const scopeData = scopeLibrary[state.workingRole.scope];
        refs.scopeSelect.value = state.workingRole.scope;
        refs.scopeSummary.textContent = scopeData.summary;
        refs.scopeDescription.textContent = scopeData.description;
        refs.scopeSuggestion.textContent = scopeData.suggestion;
      }

      function renderPermissionTree() {
        refs.permissionTree.innerHTML = "";
        if (!state.workingRole) {
          refs.permissionEmpty.classList.add("hidden");
          return;
        }
        const totalEnabled = countLeafPermissions(state.workingRole.permissions);
        refs.permissionEmpty.classList.toggle("hidden", totalEnabled > 0);

        state.workingRole.permissions.forEach((node) => {
          refs.permissionTree.appendChild(createPermissionNode(node));
        });
      }

      function createPermissionNode(node) {
        const item = document.createElement("li");
        const hasChildren = !!(node.children && node.children.length);
        const stateName = getPermissionState(node);
        item.className = `tree-node${hasChildren && node.expanded === false ? " collapsed" : ""}`;

        const row = document.createElement("div");
        row.className = "tree-row";

        if (hasChildren) {
          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = `tree-toggle${node.expanded === false ? " collapsed" : ""}`;
          toggle.setAttribute("aria-label", `${node.label}${node.expanded === false ? "展开" : "收起"}`);
          toggle.addEventListener("click", () => {
            node.expanded = !node.expanded;
            renderPermissionTree();
          });
          row.appendChild(toggle);
        } else {
          const placeholder = document.createElement("div");
          placeholder.className = "tree-toggle-placeholder";
          row.appendChild(placeholder);
        }

        const checkbox = document.createElement("button");
        checkbox.type = "button";
        checkbox.className = `tree-checkbox ${stateName}`.trim();
        checkbox.setAttribute("aria-label", `${node.label}权限勾选`);
        checkbox.addEventListener("click", () => {
          const nextState = getPermissionState(node) !== "checked";
          setSubtreeChecked(node, nextState);
          renderAll();
        });
        row.appendChild(checkbox);

        const label = document.createElement("span");
        label.className = "tree-label";
        label.textContent = node.label;
        row.appendChild(label);

        const meta = document.createElement("span");
        meta.className = "tree-meta";
        if (hasChildren) {
          meta.textContent = `${countLeafPermissions(node.children)} 项权限`;
        }
        row.appendChild(meta);

        item.appendChild(row);

        if (hasChildren) {
          const children = document.createElement("ul");
          children.className = "tree-children";
          node.children.forEach((child) => children.appendChild(createPermissionNode(child)));
          item.appendChild(children);
        }
        return item;
      }

      function renderAll() {
        renderRoleList();
        renderForm();
        renderPermissionTree();
        renderScopeCard();
        updateTopTags();
        updateStickyBar();
      }

      function loadRole(roleId) {
        const role = getRoleById(roleId);
        state.selectedRoleId = role ? role.id : null;
        state.workingRole = role ? clone(role) : null;
        renderAll();
      }

      function requestRoleSwitch(roleId) {
        if (roleId === state.selectedRoleId) return;
        if (isDirty()) {
          openConfirm({
            title: "切换角色前放弃修改？",
            text: "当前角色存在未保存修改。确认切换后，这些编辑内容将被丢弃。",
            confirmText: "放弃并切换",
            confirmVariant: "danger",
            onConfirm: () => loadRole(roleId),
          });
          return;
        }
        loadRole(roleId);
      }

      function openConfirm({ title, text, confirmText = "确认", confirmVariant = "primary", onConfirm }) {
        state.pendingAction = onConfirm;
        refs.confirmTitle.textContent = title;
        refs.confirmText.textContent = text;
        refs.modalConfirmBtn.textContent = confirmText;
        refs.modalConfirmBtn.className = `btn ${confirmVariant}`;
        refs.modalLayer.classList.add("visible");
        refs.modalLayer.setAttribute("aria-hidden", "false");
      }

      function closeConfirm() {
        state.pendingAction = null;
        refs.modalLayer.classList.remove("visible");
        refs.modalLayer.setAttribute("aria-hidden", "true");
      }

      function showToast(title, text, type = "success") {
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-text">${text}</div>`;
        refs.toastStack.appendChild(toast);
        window.setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translateY(-10px)";
          window.setTimeout(() => toast.remove(), 180);
        }, 2200);
      }

      function handleFieldChange() {
        if (!state.workingRole) return;
        state.workingRole.name = refs.roleNameInput.value.trim() || "未命名角色";
        state.workingRole.code = refs.roleCodeInput.value.trim() || "ROLE_DRAFT";
        state.workingRole.status = refs.roleStatusSelect.value;
        state.workingRole.description = refs.roleDescriptionInput.value.trim();
        state.workingRole.alert =
          state.workingRole.status === "disabled"
            ? "当前角色处于停用状态，成员登录后仅保留历史数据的只读访问能力。"
            : `当前角色已分配给 ${state.workingRole.members} 位成员，停用或删除前需要先完成影响评估。`;
        renderAll();
      }

      function saveRole() {
        const savedIndex = state.roles.findIndex((role) => role.id === state.selectedRoleId);
        if (savedIndex === -1 || !state.workingRole) return;
        state.roles[savedIndex] = clone(state.workingRole);
        renderAll();
        showToast("保存成功", `角色「${state.workingRole.name}」的权限配置已更新。`, "success");
      }

      function cancelChanges() {
        const saved = getSelectedSavedRole();
        if (!saved) return;
        state.workingRole = clone(saved);
        renderAll();
        showToast("已撤销修改", "当前未保存的编辑内容已恢复到上次保存状态。", "warning");
      }

      function deleteCurrentRole() {
        if (!state.selectedRoleId) return;
        const currentRole = getSelectedSavedRole();
        if (!currentRole) return;
        openConfirm({
          title: "确认删除当前角色？",
          text: `删除「${currentRole.name}」后，对应成员的角色授权将被收回。该操作不可撤销。`,
          confirmText: "删除角色",
          confirmVariant: "danger",
          onConfirm: () => {
            const currentIndex = state.roles.findIndex((role) => role.id === state.selectedRoleId);
            state.roles = state.roles.filter((role) => role.id !== state.selectedRoleId);
            if (!state.roles.length) {
              state.selectedRoleId = null;
              state.workingRole = null;
            } else {
              const nextRole = state.roles[Math.max(0, currentIndex - 1)] || state.roles[0];
              state.selectedRoleId = nextRole.id;
              state.workingRole = clone(nextRole);
            }
            renderAll();
            showToast("删除成功", `角色「${currentRole.name}」已移出当前角色列表。`, "danger");
          },
        });
      }

      function createRole() {
        const performCreate = () => {
          const draftNumber = state.roles.length + 1;
          const draftRole = {
            id: `draft-${Date.now()}`,
            name: `新角色 ${draftNumber}`,
            code: `ROLE_DRAFT_${draftNumber}`,
            status: "enabled",
            members: 0,
            description: "请补充角色说明、权限和数据范围。",
            scope: "department",
            alert: "当前角色还没有成员，适合先完成权限配置后再分配给目标人员。",
            permissions: [
              {
                id: `draft-basic-${draftNumber}`,
                label: "基础访问",
                expanded: true,
                children: [
                  { id: `draft-view-${draftNumber}`, label: "查看页面", checked: true },
                  { id: `draft-edit-${draftNumber}`, label: "编辑记录", checked: false },
                ],
              },
            ],
          };
          state.roles.unshift(draftRole);
          loadRole(draftRole.id);
          showToast("已创建草稿角色", "可以继续编辑角色名称、权限树和数据范围。", "success");
        };

        if (isDirty()) {
          openConfirm({
            title: "新建角色前放弃当前修改？",
            text: "当前角色存在未保存编辑。确认后将放弃这些修改，并创建新的角色草稿。",
            confirmText: "放弃并新建",
            confirmVariant: "danger",
            onConfirm: performCreate,
          });
          return;
        }
        performCreate();
      }

      function exportRoles() {
        showToast("已生成导出任务", "角色列表导出已加入后台任务队列，稍后可在消息中心查看结果。", "success");
      }

      function handleScopeChange() {
        if (!state.workingRole) return;
        state.workingRole.scope = refs.scopeSelect.value;
        renderAll();
      }

      refs.roleSearchInput.addEventListener("input", (event) => {
        state.filter = event.target.value;
        renderRoleList();
      });

      refs.roleNameInput.addEventListener("input", handleFieldChange);
      refs.roleCodeInput.addEventListener("input", handleFieldChange);
      refs.roleStatusSelect.addEventListener("change", handleFieldChange);
      refs.roleDescriptionInput.addEventListener("input", handleFieldChange);
      refs.scopeSelect.addEventListener("change", handleScopeChange);

      refs.newRoleBtn.addEventListener("click", createRole);
      refs.exportBtn.addEventListener("click", exportRoles);
      refs.saveBtn.addEventListener("click", saveRole);
      refs.cancelBtn.addEventListener("click", cancelChanges);
      refs.deleteBtn.addEventListener("click", deleteCurrentRole);

      refs.expandAllBtn.addEventListener("click", () => {
        if (!state.workingRole) return;
        setAllExpanded(state.workingRole.permissions, true);
        renderPermissionTree();
      });

      refs.collapseAllBtn.addEventListener("click", () => {
        if (!state.workingRole) return;
        setAllExpanded(state.workingRole.permissions, false);
        renderPermissionTree();
      });

      refs.modalCancelBtn.addEventListener("click", closeConfirm);
      refs.modalLayer.addEventListener("click", (event) => {
        if (event.target === refs.modalLayer) {
          closeConfirm();
        }
      });
      refs.modalConfirmBtn.addEventListener("click", () => {
        const pending = state.pendingAction;
        closeConfirm();
        if (pending) pending();
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && refs.modalLayer.classList.contains("visible")) {
          closeConfirm();
        }
      });

      window.addEventListener("beforeunload", (event) => {
        if (isDirty()) {
          event.preventDefault();
          event.returnValue = "";
        }
      });

      async function runSelfTest() {
        const output = document.getElementById("selfTestOutput");
        const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

        const results = {
          initialRoleCount: document.querySelectorAll(".role-item").length,
        };

        refs.roleSearchInput.value = "HRBP";
        refs.roleSearchInput.dispatchEvent(new Event("input", { bubbles: true }));
        await wait(80);
        results.filteredRoleCount = document.querySelectorAll(".role-item").length;

        const firstFiltered = document.querySelector(".role-item");
        firstFiltered?.click();
        await wait(100);
        results.selectedRoleName = refs.roleNameInput.value;

        refs.roleDescriptionInput.value = "通过自测脚本修改后的角色说明";
        refs.roleDescriptionInput.dispatchEvent(new Event("input", { bubbles: true }));
        await wait(80);
        results.dirtyVisible = !refs.dirtyTag.classList.contains("hidden");

        refs.scopeSelect.value = "custom";
        refs.scopeSelect.dispatchEvent(new Event("change", { bubbles: true }));
        await wait(80);
        results.scopeSummary = refs.scopeSummary.textContent;

        const firstUnchecked = document.querySelector(".tree-checkbox:not(.checked)");
        firstUnchecked?.click();
        await wait(80);
        results.changedTip = refs.stickyTip.textContent.trim();

        refs.saveBtn.click();
        await wait(100);
        results.saveDisabledAfterSave = refs.saveBtn.disabled;
        results.latestToastTitle = document.querySelector(".toast-title")?.textContent || "";

        output.textContent = JSON.stringify(results, null, 2);
      }

      renderAll();

      if (new URLSearchParams(window.location.search).get("self-test") === "1") {
        window.setTimeout(() => {
          runSelfTest();
        }, 40);
      }
    </script>
  </body>
</html>
