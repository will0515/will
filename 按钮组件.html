<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>按钮组件</title>

  <!--
    还原依据：按钮.sketch
    - 中号按钮高度 30px，小号图标按钮 24px
    - 主色 #0C9B72，常规边框 #CCCCCC，常规文字 #222222
    - 中号圆角 8px，小号圆角 6px
    - 文字为 Source Han Sans SC Regular / 12px / 20px
    - 页面展示 Sketch 中的全部 13 个按钮变体
  -->

  <style>
    :root {
      color-scheme: light;
      --brand: #0c9b72;
      --brand-soft: #e5eae7;
      --text: #222222;
      --ghost-text: #363636;
      --line: #cccccc;
      --page: #f5f6f7;
      --surface: #ffffff;
      --stage: #fafafa;
      --stage-line: #eceef1;
      --heading: #20242a;
      --muted: #737b86;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--page);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--heading);
      background: var(--page);
      font-family: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button {
      font: inherit;
    }

    .page {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    .page-header {
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.35;
    }

    .section {
      padding: 28px;
      border: 1px solid #e4e7eb;
      border-radius: 12px;
      background: var(--surface);
    }

    .section + .section {
      margin-top: 16px;
    }

    .section h2 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
    }

    .section-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 18px;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 126px;
      margin-top: 22px;
      padding: 32px;
      border: 1px solid var(--stage-line);
      border-radius: 8px;
      background: var(--stage);
    }

    .specimen-list {
      margin-top: 22px;
      border-top: 1px solid var(--stage-line);
    }

    .specimen-row {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      gap: 24px;
      align-items: center;
      min-height: 88px;
      padding: 22px 0;
      border-bottom: 1px solid var(--stage-line);
    }

    .row-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 18px;
    }

    .button-set {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
    }

    .button-sample {
      display: grid;
      gap: 9px;
      justify-items: start;
    }

    .sample-label {
      color: #9299a3;
      font-size: 11px;
      line-height: 16px;
    }

    /* Sketch 按钮本体 */
    .ssc-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      height: 30px;
      margin: 0;
      padding: 5px 10px;
      border: 0;
      border-radius: 8px;
      color: var(--text);
      background: #ffffff;
      cursor: pointer;
      font-family: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      font-size: 12px;
      font-style: normal;
      font-weight: 400;
      line-height: 20px;
      white-space: nowrap;
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }

    .ssc-button:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--brand) 34%, transparent);
      outline-offset: 2px;
    }

    .ssc-button:active {
      filter: brightness(0.96);
    }

    .ssc-button--primary {
      color: #ffffff;
      border: 0;
      background: var(--brand);
      box-shadow: inset 0 0 0 1px var(--brand);
    }

    .ssc-button--brand-outline {
      color: var(--brand);
      border: 0;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px var(--brand);
    }

    .ssc-button--default {
      color: var(--text);
      border: 0;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .ssc-button--ghost {
      color: var(--ghost-text);
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .ssc-button--text {
      width: 80px;
    }

    .ssc-button--icon-text {
      width: 95px;
      padding-left: 5px;
      padding-right: 10px;
    }

    .ssc-button--icon-text.ssc-button--ghost {
      width: 100px;
      padding-left: 10px;
    }

    .ssc-button--icon-text.ssc-button--ghost .ssc-button__icon {
      color: #29282d;
    }

    .ssc-button--icon-only {
      width: 30px;
      padding: 5px;
    }

    .ssc-button--icon-only.ssc-button--ghost {
      color: var(--text);
      border-radius: 8px;
    }

    .ssc-button--icon-small {
      width: 24px;
      height: 24px;
      padding: 4px;
      border: 0;
      border-radius: 6px;
      color: var(--brand);
      background: var(--brand-soft);
      box-shadow: none;
    }

    .ssc-button__label {
      display: block;
      flex: 0 0 60px;
      width: 60px;
      height: 20px;
      line-height: 20px;
      text-align: left;
    }

    .ssc-button--text .ssc-button__label {
      text-align: center;
    }

    .ssc-button__icon {
      display: block;
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      color: currentColor;
    }

    .ssc-button--icon-small .ssc-button__icon {
      width: 16px;
      height: 16px;
    }

    .ssc-button__icon path,
    .ssc-button__icon line {
      vector-effect: non-scaling-stroke;
    }

    .ssc-button.is-spinning .ssc-button__icon {
      animation: spin 420ms ease-in-out;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ssc-button.is-spinning .ssc-button__icon {
        animation: none;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding-top: 32px;
      }

      .section {
        padding: 22px 18px;
      }

      .specimen-row {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .button-set {
        gap: 18px 14px;
      }
    }
  </style>
</head>
<body>
  <!-- 公共 SVG 图标：添加与刷新路径均来自 Sketch 文件 -->
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M8 12h8M12 8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path fill="currentColor" d="M20.7071 8.7071C20.7071 8.7071 23.1464 11.1464 23.1464 11.1464C23.3417 11.3417 23.3417 11.6583 23.1464 11.8536C23.0527 11.9473 22.9255 12 22.7929 12H21C21 14.4186 20.0402 16.6877 18.364 18.364C16.6877 20.0402 14.4186 21 12 21C9.5814 21 7.3123 20.0402 5.636 18.364C5.2455 17.9734 5.2455 17.3403 5.636 16.9497C6.0266 16.5592 6.6597 16.5592 7.0503 16.9497C8.3552 18.2547 10.1173 19 12 19C13.8827 19 15.6448 18.2547 16.9497 16.9497C18.2547 15.6448 19 13.8827 19 12H17.2071C16.931 12 16.7071 11.7761 16.7071 11.5C16.7071 11.3674 16.7598 11.2402 16.8536 11.1464L19.2929 8.7071C19.6834 8.3166 20.3166 8.3166 20.7071 8.7071Z"/>
      <path fill="currentColor" d="M12 3C14.4186 3 16.6877 3.9598 18.364 5.636C18.7545 6.0266 18.7545 6.6597 18.364 7.0503C17.9734 7.4408 17.3403 7.4408 16.9497 7.0503C15.6448 5.7453 13.8827 5 12 5C10.1173 5 8.3552 5.7453 7.0503 7.0503C5.7453 8.3552 5 10.1173 5 12H6.7929C7.069 12 7.2929 12.2239 7.2929 12.5C7.2929 12.6326 7.2402 12.7598 7.1464 12.8536L4.7071 15.2929C4.3166 15.6834 3.6834 15.6834 3.2929 15.2929L.8536 12.8536C.6583 12.6583.6583 12.3417.8536 12.1464C.9473 12.0527 1.0745 12 1.2071 12H3C3 9.5814 3.9598 7.3123 5.636 5.636C7.3123 3.9598 9.5814 3 12 3Z"/>
    </symbol>
  </svg>

  <main class="page">
    <header class="page-header">
      <p class="eyebrow">SSC COMPONENT</p>
      <h1>按钮组件</h1>
    </header>

    <section class="section" aria-labelledby="preview-title">
      <h2 id="preview-title">组件预览</h2>
      <p class="section-note">Sketch 预览中的高亮图标文字按钮，原尺寸 95 × 30 px。</p>
      <div class="stage">
        <button class="ssc-button ssc-button--primary ssc-button--icon-text" type="button">
          <svg class="ssc-button__icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
          <span class="ssc-button__label">新建处理组</span>
        </button>
      </div>
    </section>

    <section class="section" aria-labelledby="variants-title">
      <h2 id="variants-title">全部变体</h2>
      <p class="section-note">按 Sketch 中的尺寸、颜色、边框和圆角还原。</p>

      <div class="specimen-list">
        <div class="specimen-row">
          <div class="row-label">中 / 图标 + 文字</div>
          <div class="button-set">
            <div class="button-sample">
              <button class="ssc-button ssc-button--primary ssc-button--icon-text" type="button">
                <svg class="ssc-button__icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
                <span class="ssc-button__label">新建处理组</span>
              </button>
              <span class="sample-label">高亮</span>
            </div>
            <div class="button-sample">
              <button class="ssc-button ssc-button--brand-outline ssc-button--icon-text" type="button">
                <svg class="ssc-button__icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
                <span class="ssc-button__label">新建处理组</span>
              </button>
              <span class="sample-label">普通高亮</span>
            </div>
            <div class="button-sample">
              <button class="ssc-button ssc-button--default ssc-button--icon-text" type="button">
                <svg class="ssc-button__icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
                <span class="ssc-button__label">新建处理组</span>
              </button>
              <span class="sample-label">常规</span>
            </div>
            <div class="button-sample">
              <button class="ssc-button ssc-button--ghost ssc-button--icon-text" type="button">
                <svg class="ssc-button__icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
                <span class="ssc-button__label">新建处理组</span>
              </button>
              <span class="sample-label">幽灵</span>
            </div>
          </div>
        </div>

        <div class="specimen-row">
          <div class="row-label">中 / 文字</div>
          <div class="button-set">
            <div class="button-sample">
              <button class="ssc-button ssc-button--primary ssc-button--text" type="button">
                <span class="ssc-button__label">新建处理组</span>
              </button>
              <span class="sample-label">高亮</span>
            </div>
            <div class="button-sample">
              <button class="ssc-button ssc-button--brand-outline ssc-button--text" type="button">
                <span class="ssc-button__label">新建处理组</span>
              </button>
              <span class="sample-label">普通高亮</span>
            </div>
            <div class="button-sample">
              <button class="ssc-button ssc-button--default ssc-button--text" type="button">
                <span class="ssc-button__label">新建处理组</span>
              </button>
              <span class="sample-label">常规</span>
            </div>
            <div class="button-sample">
              <button class="ssc-button ssc-button--ghost ssc-button--text" type="button">
                <span class="ssc-button__label">新建处理组</span>
              </button>
              <span class="sample-label">幽灵</span>
            </div>
          </div>
        </div>

        <div class="specimen-row">
          <div class="row-label">中 / 图标</div>
          <div class="button-set">
            <div class="button-sample">
              <button class="ssc-button ssc-button--primary ssc-button--icon-only" type="button" aria-label="刷新">
                <svg class="ssc-button__icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>
              </button>
              <span class="sample-label">高亮</span>
            </div>
            <div class="button-sample">
              <button class="ssc-button ssc-button--brand-outline ssc-button--icon-only" type="button" aria-label="刷新">
                <svg class="ssc-button__icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>
              </button>
              <span class="sample-label">普通高亮</span>
            </div>
            <div class="button-sample">
              <button class="ssc-button ssc-button--default ssc-button--icon-only" type="button" aria-label="刷新">
                <svg class="ssc-button__icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>
              </button>
              <span class="sample-label">常规</span>
            </div>
            <div class="button-sample">
              <button class="ssc-button ssc-button--ghost ssc-button--icon-only" type="button" aria-label="刷新">
                <svg class="ssc-button__icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>
              </button>
              <span class="sample-label">幽灵</span>
            </div>
          </div>
        </div>

        <div class="specimen-row">
          <div class="row-label">小 / 图标</div>
          <div class="button-set">
            <div class="button-sample">
              <button class="ssc-button ssc-button--icon-small" type="button" aria-label="刷新">
                <svg class="ssc-button__icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>
              </button>
              <span class="sample-label">常规</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.querySelectorAll('.ssc-button').forEach((button) => {
      button.addEventListener('click', () => {
        if (!button.querySelector('use[href="#icon-refresh"]')) return;
        button.classList.remove('is-spinning');
        requestAnimationFrame(() => button.classList.add('is-spinning'));
      });
      button.addEventListener('animationend', () => {
        button.classList.remove('is-spinning');
      });
    });
  </script>
</body>
</html>
