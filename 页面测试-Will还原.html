<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>需求模板 - Owner 配置</title>
  <style>
    :root {
      --accent: #079b72;
      --accent-foreground: #f8fffd;
      --accent-hover: #087e61;
      --accent-soft: #e8f8f3;
      --accent-soft-foreground: #078663;
      --background: #f8faf9;
      --foreground: #333b38;
      --surface: #fdfefd;
      --surface-foreground: #333b38;
      --overlay: #fdfefd;
      --overlay-foreground: #333b38;
      --default: #f4f5f4;
      --default-foreground: #666e6b;
      --muted: #9ba3a0;
      --muted-soft: #f7f8f7;
      --border: #e7ebe9;
      --field-background: #fdfefd;
      --field-foreground: #333b38;
      --field-placeholder: #c7cdca;
      --field-border: #dfe5e2;
      --focus: #5d6df8;
      --link: #5d6df8;
      --danger: #ef4f55;
      --danger-foreground: #fff8f8;
      --danger-soft: #fff0f0;
      --warning: #ffb31a;
      --warning-foreground: #5e4300;
      --success: #10a879;
      --success-foreground: #f8fffd;
      --blue: #5d6df8;
      --blue-soft: #edf0ff;
      --blue-foreground: #4e5fdf;
      --tag-green: #09a976;
      --tag-green-soft: #e4f8f1;
      --tag-red: #ef6259;
      --tag-red-soft: #fff0ed;
      --grid-dot: #c5ece2;
      --connector-output: #6664fa;
      --connector-input: #ffb31a;
      --scrollbar: #cfd6d3;
      --shadow-card: 0 1px 0 color-mix(in srgb, var(--foreground) 3%, transparent), 0 5px 15px color-mix(in srgb, var(--foreground) 6%, transparent);
      --shadow-panel: -5px 0 20px color-mix(in srgb, var(--foreground) 5%, transparent);
      --font-ui: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: var(--foreground);
      background: var(--background);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .app-shell {
      display: grid;
      grid-template-rows: 60px minmax(0, 1fr);
      min-height: 100vh;
      background: var(--background);
    }

    .topbar {
      position: relative;
      z-index: 30;
      display: flex;
      align-items: center;
      min-width: 0;
      height: 60px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .back-button,
    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .back-button {
      margin-right: 0;
    }

    .back-button:hover,
    .icon-button:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .icon {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .title-area {
      display: flex;
      min-width: 180px;
      flex-direction: column;
      justify-content: center;
      margin-right: 10px;
    }

    .title-line {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 5px;
      height: 20px;
    }

    .page-title {
      overflow: hidden;
      margin: 0;
      color: var(--surface-foreground);
      font-size: 14px;
      font-weight: 700;
      line-height: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subtitle {
      overflow: hidden;
      max-width: 240px;
      color: var(--muted);
      font-size: 10px;
      line-height: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .edit-title {
      width: 20px;
      height: 20px;
      color: var(--muted);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      color: var(--blue-foreground);
      background: var(--blue-soft);
      font-size: 10px;
      line-height: 20px;
      white-space: nowrap;
    }

    .owner-toolbar {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 5px;
    }

    .field {
      position: relative;
      display: flex;
      align-items: center;
      width: 150px;
      height: 30px;
    }

    .field select,
    .field input {
      width: 100%;
      height: 30px;
      padding: 0 30px 0 10px;
      border: 1px solid var(--field-border);
      border-radius: 10px;
      color: var(--field-foreground);
      background: var(--field-background);
      font-size: 12px;
      outline: 0;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .field input {
      padding-right: 10px;
    }

    .field select {
      appearance: none;
      cursor: pointer;
    }

    .field input::placeholder,
    .field select:invalid {
      color: var(--field-placeholder);
    }

    .field select:hover,
    .field input:hover {
      border-color: var(--muted);
    }

    .field select:focus,
    .field input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 2px var(--blue-soft);
    }

    .select-chevron {
      position: absolute;
      right: 10px;
      width: 15px;
      height: 15px;
      color: var(--muted);
      pointer-events: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: auto;
    }

    .top-actions .button {
      width: 44px;
      padding: 0;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--default-foreground);
      background: var(--surface);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 150ms ease, color 150ms ease, border-color 150ms ease, background-color 150ms ease;
    }

    .button:hover {
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
    }

    .button-danger {
      color: var(--danger);
      border-color: var(--danger);
    }

    .button-danger:hover {
      color: var(--danger-foreground);
      border-color: var(--danger);
      background: var(--danger);
    }

    .button-primary {
      color: var(--accent-foreground);
      border-color: var(--accent);
      background: var(--accent);
    }

    .button-primary:hover {
      color: var(--accent-foreground);
      border-color: var(--accent-hover);
      background: var(--accent-hover);
    }

    .panel-toggle {
      display: none;
      gap: 5px;
    }

    .workspace {
      position: relative;
      display: grid;
      min-height: 0;
      grid-template-columns: minmax(0, 1fr) 400px;
    }

    .workflow-canvas {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background-color: var(--surface);
      background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
      background-position: 0 0;
      background-size: 12px 12px;
      touch-action: none;
    }

    .canvas-inner {
      position: relative;
      width: 100%;
      min-width: 720px;
      height: 100%;
      min-height: 580px;
    }

    .node {
      position: absolute;
      z-index: 2;
      width: 250px;
      height: 110px;
      min-height: 110px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow-card);
      user-select: none;
      cursor: grab;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .node:hover {
      border-color: var(--field-border);
      box-shadow: 0 5px 20px color-mix(in srgb, var(--foreground) 10%, transparent);
    }

    .node:active {
      cursor: grabbing;
    }

    .node.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-soft), var(--shadow-card);
    }

    .node-start {
      left: 30.5%;
      top: 50px;
    }

    .node-end {
      left: 30.5%;
      top: 192px;
    }

    .node-approval {
      left: 63.5%;
      top: 50px;
    }

    .node-offer {
      left: 63.5%;
      top: 210px;
    }

    .node-notice {
      left: 63.5%;
      top: 370px;
    }

    .node-head {
      display: flex;
      align-items: center;
      height: 40px;
      padding: 0 10px;
      border-radius: 10px 10px 0 0;
      background: var(--default);
    }

    .node-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      margin-right: 10px;
      border-radius: 5px;
      color: var(--accent-foreground);
      background: var(--accent);
    }

    .node-icon.task {
      color: var(--accent-foreground);
      background: var(--blue);
    }

    .node-icon .icon {
      width: 15px;
      height: 15px;
    }

    .node-title {
      min-width: 0;
      overflow: hidden;
      font-size: 12px;
      font-weight: 700;
      line-height: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-menu {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      margin-left: auto;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
    }

    .node-menu:hover {
      background: var(--border);
    }

    .dots {
      display: flex;
      gap: 2px;
    }

    .dots span {
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: currentColor;
    }

    .node-body {
      padding: 5px 10px;
    }

    .node-row {
      display: grid;
      grid-template-columns: 35px minmax(0, 1fr);
      align-items: center;
      min-height: 30px;
      color: var(--surface-foreground);
      font-size: 12px;
      line-height: 20px;
    }

    .node-label {
      color: var(--field-placeholder);
    }

    .node-value {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      font-size: 10px;
      line-height: 20px;
      white-space: nowrap;
    }

    .tag-blue {
      color: var(--blue-foreground);
      background: var(--blue-soft);
    }

    .tag-green {
      color: var(--tag-green);
      background: var(--tag-green-soft);
    }

    .tag-red {
      color: var(--tag-red);
      background: var(--tag-red-soft);
    }

    .port {
      position: absolute;
      z-index: 3;
      width: 10px;
      height: 10px;
      border: 1px solid var(--surface);
      border-radius: 50%;
    }

    .port-output {
      right: -5px;
      background: var(--connector-output);
    }

    .port-input {
      left: -5px;
      background: var(--connector-input);
    }

    .port-center {
      top: 50%;
      transform: translateY(-50%);
    }

    .port-top {
      top: 40px;
    }

    .port-middle {
      top: 60px;
    }

    .port-bottom {
      top: 80px;
    }

    .property-panel {
      position: relative;
      z-index: 20;
      min-width: 0;
      overflow: auto;
      border-left: 1px solid var(--border);
      background: var(--overlay);
      color: var(--overlay-foreground);
    }

    .panel-header {
      position: sticky;
      top: 0;
      z-index: 3;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) 30px;
      align-items: start;
      min-height: 67px;
      height: 67px;
      padding: 15px;
      border-bottom: 1px solid var(--border);
      background: var(--overlay);
    }

    .panel-title-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      color: var(--accent-foreground);
      background: var(--blue);
    }

    .panel-heading {
      min-width: 0;
      padding-left: 10px;
    }

    .panel-title-line {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
      height: 20px;
    }

    .panel-title {
      overflow: hidden;
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-subtitle {
      overflow: hidden;
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-content {
      padding: 0 15px 20px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 30px;
      margin: 15px 0;
      padding: 2px;
      border-radius: 10px;
      background: var(--default);
    }

    .tab {
      height: 26px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      color: var(--default-foreground);
      background: transparent;
      font-size: 12px;
      cursor: pointer;
    }

    .tab.active {
      color: var(--surface-foreground);
      background: var(--surface);
      box-shadow: 0 1px 3px color-mix(in srgb, var(--foreground) 8%, transparent);
    }

    .form-section {
      display: block;
    }

    .form-section[hidden] {
      display: none;
    }

    .form-label {
      display: block;
      margin: 0 0 10px;
      color: var(--surface-foreground);
      font-size: 12px;
      font-weight: 700;
      line-height: 20px;
    }

    .panel-field {
      position: relative;
      width: 100%;
      margin-bottom: 10px;
    }

    .panel-field select,
    .panel-field input {
      width: 100%;
      height: 30px;
      padding: 0 35px 0 10px;
      border: 1px solid var(--field-border);
      border-radius: 10px;
      color: var(--field-foreground);
      background: var(--field-background);
      font-size: 12px;
      outline: 0;
    }

    .panel-field select {
      appearance: none;
    }

    .panel-field input::placeholder,
    .panel-field select:invalid {
      color: var(--field-placeholder);
    }

    .panel-field select:focus,
    .panel-field input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 2px var(--blue-soft);
    }

    .field-icon {
      position: absolute;
      top: 5px;
      right: 10px;
      width: 20px;
      height: 20px;
      color: var(--field-placeholder);
      pointer-events: none;
    }

    .empty-tab {
      display: grid;
      min-height: 160px;
      place-items: center;
      padding: 30px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    .empty-illustration {
      display: grid;
      width: 50px;
      height: 50px;
      margin: 0 auto 10px;
      place-items: center;
      border-radius: 15px;
      color: var(--blue);
      background: var(--blue-soft);
    }

    .mobile-scrim {
      display: none;
    }

    .toast {
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      max-width: min(360px, calc(100vw - 30px));
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--surface-foreground);
      background: var(--surface);
      box-shadow: 0 10px 30px color-mix(in srgb, var(--foreground) 15%, transparent);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 15px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast-mark {
      display: grid;
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      color: var(--success-foreground);
      background: var(--success);
      font-size: 12px;
      font-weight: 700;
    }

    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: minmax(0, 1fr) 340px;
      }

      .title-area {
        min-width: 160px;
      }

      .subtitle {
        max-width: 180px;
      }

      .field {
        width: 130px;
      }

      .node-start {
        left: 10%;
      }

      .node-end {
        left: 8%;
      }

      .node-approval,
      .node-offer,
      .node-notice {
        left: 52%;
      }
    }

    @media (max-width: 820px) {
      body {
        overflow: auto;
      }

      .app-shell {
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 100svh;
      }

      .topbar {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) auto;
        grid-template-rows: auto 30px;
        min-height: 110px;
        height: auto;
        align-content: center;
        gap: 5px;
        padding: 10px 15px;
      }

      .back-button {
        grid-column: 1;
        grid-row: 1;
      }

      .title-area {
        grid-column: 2;
        grid-row: 1;
        min-width: 0;
      }

      .subtitle {
        max-width: min(280px, 60vw);
      }

      .owner-toolbar {
        display: grid;
        grid-column: 1 / -1;
        grid-row: 2;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
        padding-left: 30px;
      }

      .field {
        width: 100%;
        min-width: 0;
      }

      .field input,
      .field select {
        min-width: 0;
      }

      .top-actions {
        grid-column: 3;
        grid-row: 1;
        margin-left: 0;
      }

      .top-actions .button-danger,
      .top-actions .button:not(.button-primary):not(.panel-toggle) {
        display: none;
      }

      .panel-toggle {
        display: inline-flex;
      }

      .workspace {
        display: block;
        width: 100%;
        min-height: calc(100svh - 110px);
      }

      .workflow-canvas {
        min-height: calc(100svh - 110px);
        overflow: auto;
        touch-action: pan-x pan-y;
      }

      .canvas-inner {
        min-width: 100%;
        min-height: 970px;
        padding: 20px 15px 60px;
      }

      .workflow-list {
        display: grid;
        width: min(100%, 520px);
        max-width: 100%;
        margin: 0 auto;
        gap: 20px;
      }

      .node {
        position: relative;
        inset: auto !important;
        width: 100%;
        max-width: 100%;
        min-height: 110px;
        cursor: pointer;
      }

      .node-start {
        order: 1;
      }

      .node-approval {
        order: 2;
      }

      .node-offer {
        order: 3;
      }

      .node-notice {
        order: 4;
      }

      .node-end {
        order: 5;
      }

      .property-panel {
        position: fixed;
        z-index: 60;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100vw;
        max-height: min(640px, 82svh);
        border-top: 1px solid var(--border);
        border-left: 0;
        border-radius: 15px 15px 0 0;
        box-shadow: 0 -10px 30px color-mix(in srgb, var(--foreground) 15%, transparent);
        transform: translateY(105%);
        transition: transform 240ms cubic-bezier(.22, 1, .36, 1);
      }

      .property-panel.open {
        transform: translateY(0);
      }

      .panel-header {
        min-height: 70px;
      }

      .mobile-scrim {
        position: fixed;
        z-index: 50;
        inset: 0;
        display: block;
        border: 0;
        background: color-mix(in srgb, var(--foreground) 35%, transparent);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      .mobile-scrim.show {
        opacity: 1;
        pointer-events: auto;
      }
    }

    @media (max-width: 430px) {
      .topbar {
        min-height: 115px;
        padding-right: 10px;
        padding-left: 10px;
      }

      .page-title {
        max-width: 130px;
      }

      .subtitle {
        max-width: 210px;
      }

      .top-actions {
        gap: 0;
      }

      .button {
        padding: 0 10px;
      }

      .top-actions .button {
        width: auto;
        padding: 0 10px;
      }

      .owner-toolbar {
        padding-left: 0;
      }

      .workflow-canvas {
        min-height: calc(100svh - 115px);
      }

      .canvas-inner {
        padding-right: 10px;
        padding-left: 10px;
      }

      .node {
        min-width: 0;
      }

      .panel-content {
        padding-right: 10px;
        padding-left: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="back-button" type="button" aria-label="返回">
        <svg class="icon" viewBox="0 0 30 30" aria-hidden="true">
          <path d="m18 7-8 8 8 8"></path>
        </svg>
      </button>

      <div class="title-area">
        <div class="title-line">
          <h1 class="page-title" id="pageTitle">未命名需求模版</h1>
          <button class="icon-button edit-title" type="button" aria-label="编辑模板名称" id="editTitle">
            <svg class="icon" viewBox="0 0 30 30" aria-hidden="true">
              <path d="M18.5 6.5 23.5 11.5 12 23H7v-5z"></path>
              <path d="m16 9 5 5"></path>
            </svg>
          </button>
          <span class="status-badge">未发布</span>
        </div>
        <span class="subtitle">可填写服务的业务用途、边界或负责人信息</span>
      </div>

      <div class="owner-toolbar" aria-label="Owner 筛选">
        <label class="field">
          <select required aria-label="请选择 Owner 类型">
            <option value="" selected disabled>请选择Owner类型</option>
            <option>岗位Owner</option>
            <option>部门Owner</option>
            <option>人员Owner</option>
          </select>
          <svg class="icon select-chevron" viewBox="0 0 30 30" aria-hidden="true">
            <path d="m9 12 6 6 6-6"></path>
          </svg>
        </label>
        <label class="field">
          <input type="search" placeholder="搜索Owner" aria-label="搜索 Owner">
        </label>
      </div>

      <div class="top-actions">
        <button class="button button-danger" type="button" data-message="删除操作已取消">删除</button>
        <button class="button" type="button" data-message="模板已保存">保存</button>
        <button class="button panel-toggle" type="button" id="panelToggle" aria-controls="propertyPanel" aria-expanded="false">配置</button>
        <button class="button button-primary" type="button" data-message="模板已发布">发布</button>
      </div>
    </header>

    <main class="workspace">
      <section class="workflow-canvas" id="workflowCanvas" aria-label="需求流程画布">
        <div class="canvas-inner">
          <div class="workflow-list">
            <article class="node node-start selected" tabindex="0" data-title="开始" data-tag="开始节点" data-tag-class="tag-green" aria-label="开始节点">
              <div class="node-head">
                <span class="node-icon">
                  <svg class="icon" viewBox="0 0 30 30" aria-hidden="true">
                    <path d="M20 9a8 8 0 1 0 1.5 10"></path>
                    <path d="M20 5v6h-6"></path>
                    <path d="M11 15h8"></path>
                  </svg>
                </span>
                <span class="node-title">开始</span>
              </div>
              <div class="node-body">
                <div class="node-row"><span class="node-label">名称</span><span class="node-value">创建需求</span></div>
                <div class="node-row"><span class="node-label">输入</span><span class="tag tag-blue">4项</span></div>
              </div>
              <span class="port port-output port-center" aria-hidden="true"></span>
            </article>

            <article class="node node-end" tabindex="0" data-title="结束" data-tag="结束节点" data-tag-class="tag-green" aria-label="结束节点">
              <div class="node-head">
                <span class="node-icon">
                  <svg class="icon" viewBox="0 0 30 30" aria-hidden="true">
                    <path d="M10 9a8 8 0 1 1-1.5 10"></path>
                    <path d="M10 5v6h6"></path>
                    <path d="M11 15h8"></path>
                  </svg>
                </span>
                <span class="node-title">结束</span>
              </div>
              <div class="node-body">
                <div class="node-row"><span class="node-label">名称</span><span class="node-value">需求结束</span></div>
                <div class="node-row"><span class="node-label">输入</span><span class="tag tag-blue">4项</span></div>
              </div>
              <span class="port port-input port-center" aria-hidden="true"></span>
            </article>

            <article class="node node-approval" tabindex="0" data-title="候选人资质审批" data-tag="审批类" data-tag-class="tag-blue" aria-label="候选人资质审批节点">
              <div class="node-head">
                <span class="node-icon task">
                  <svg class="icon" viewBox="0 0 30 30" aria-hidden="true">
                    <path d="M10 5h8l5 5v15H10z"></path>
                    <path d="M18 5v6h5M13 16h7M13 20h7"></path>
                  </svg>
                </span>
                <span class="node-title">候选人资质审批</span>
                <button class="node-menu" type="button" aria-label="更多操作">
                  <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
                </button>
              </div>
              <div class="node-body">
                <div class="node-row"><span class="node-label">类型</span><span class="tag tag-blue">审批类</span></div>
                <div class="node-row"><span class="node-label">描述</span><span class="node-value">审批候选人资质与岗位匹配情况</span></div>
              </div>
              <span class="port port-input port-center" aria-hidden="true"></span>
              <span class="port port-output port-middle" aria-hidden="true"></span>
            </article>

            <article class="node node-offer" tabindex="0" data-title="Offer内容确认" data-tag="确认/提交类" data-tag-class="tag-green" aria-label="Offer 内容确认节点">
              <div class="node-head">
                <span class="node-icon task">
                  <svg class="icon" viewBox="0 0 30 30" aria-hidden="true">
                    <path d="M10 5h8l5 5v15H10z"></path>
                    <path d="M18 5v6h5M13 16h7M13 20h7"></path>
                  </svg>
                </span>
                <span class="node-title">Offer内容确认</span>
                <button class="node-menu" type="button" aria-label="更多操作">
                  <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
                </button>
              </div>
              <div class="node-body">
                <div class="node-row"><span class="node-label">类型</span><span class="tag tag-green">确认/提交类</span></div>
                <div class="node-row"><span class="node-label">描述</span><span class="node-value">确认 Offer 薪酬与入职信息</span></div>
              </div>
              <span class="port port-input port-center" aria-hidden="true"></span>
              <span class="port port-output port-top" aria-hidden="true"></span>
              <span class="port port-output port-middle" aria-hidden="true"></span>
              <span class="port port-output port-bottom" aria-hidden="true"></span>
            </article>

            <article class="node node-notice" tabindex="0" data-title="发送 Offer通知" data-tag="执行类" data-tag-class="tag-red" aria-label="发送 Offer 通知节点">
              <div class="node-head">
                <span class="node-icon task">
                  <svg class="icon" viewBox="0 0 30 30" aria-hidden="true">
                    <path d="M10 5h8l5 5v15H10z"></path>
                    <path d="M18 5v6h5M13 16h7M13 20h7"></path>
                  </svg>
                </span>
                <span class="node-title">发送 Offer通知</span>
                <button class="node-menu" type="button" aria-label="更多操作">
                  <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
                </button>
              </div>
              <div class="node-body">
                <div class="node-row"><span class="node-label">类型</span><span class="tag tag-red">执行类</span></div>
                <div class="node-row"><span class="node-label">描述</span><span class="node-value">向候选人发送 Offer 通知</span></div>
              </div>
              <span class="port port-input port-center" aria-hidden="true"></span>
              <span class="port port-output port-middle" aria-hidden="true"></span>
            </article>
          </div>
        </div>
      </section>

      <aside class="property-panel" id="propertyPanel" aria-label="节点配置面板">
        <div class="panel-header">
          <span class="panel-title-icon">
            <svg class="icon" viewBox="0 0 30 30" aria-hidden="true">
              <path d="M10 5h8l5 5v15H10z"></path>
              <path d="M18 5v6h5M13 16h7M13 20h7"></path>
            </svg>
          </span>
          <div class="panel-heading">
            <div class="panel-title-line">
              <h2 class="panel-title" id="panelTitle">候选人资质审批</h2>
              <span class="tag tag-blue" id="panelTag">审批类</span>
            </div>
            <p class="panel-subtitle">可填写服务的业务用途、边界或负责人信息</p>
          </div>
          <button class="icon-button" type="button" id="panelClose" aria-label="关闭配置面板">
            <svg class="icon" viewBox="0 0 30 30" aria-hidden="true">
              <path d="m9 9 12 12M21 9 9 21"></path>
            </svg>
          </button>
        </div>

        <div class="panel-content">
          <div class="tabs" role="tablist" aria-label="节点配置">
            <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="owner">Owner配置</button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-tab="input">输入</button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-tab="preview">模板概览</button>
          </div>

          <section class="form-section" id="tab-owner" role="tabpanel">
            <label class="form-label" for="ownerType">工单Owner</label>
            <div class="panel-field">
              <select id="ownerType" required>
                <option value="" selected disabled>请选择Owner类型</option>
                <option>岗位Owner</option>
                <option>部门Owner</option>
                <option>人员Owner</option>
              </select>
              <svg class="icon field-icon" viewBox="0 0 30 30" aria-hidden="true">
                <path d="m9 12 6 6 6-6"></path>
              </svg>
            </div>
            <div class="panel-field">
              <input type="text" placeholder="请选择Owner" aria-label="请选择 Owner">
              <svg class="icon field-icon" viewBox="0 0 30 30" aria-hidden="true">
                <circle cx="15" cy="15" r="4"></circle>
                <path d="M15 4v3M15 23v3M4 15h3M23 15h3M7.2 7.2l2.1 2.1M20.7 20.7l2.1 2.1M22.8 7.2l-2.1 2.1M9.3 20.7l-2.1 2.1"></path>
              </svg>
            </div>
          </section>

          <section class="form-section empty-tab" id="tab-input" role="tabpanel" hidden>
            <div>
              <div class="empty-illustration">
                <svg class="icon" viewBox="0 0 30 30" aria-hidden="true">
                  <path d="M7 8h16v14H7zM11 12h8M11 17h5"></path>
                </svg>
              </div>
              暂无输入项，可从流程变量中添加
            </div>
          </section>

          <section class="form-section empty-tab" id="tab-preview" role="tabpanel" hidden>
            <div>
              <div class="empty-illustration">
                <svg class="icon" viewBox="0 0 30 30" aria-hidden="true">
                  <path d="M5 15s4-7 10-7 10 7 10 7-4 7-10 7S5 15 5 15Z"></path>
                  <circle cx="15" cy="15" r="3"></circle>
                </svg>
              </div>
              选择节点后可查看模板概览
            </div>
          </section>
        </div>
      </aside>
    </main>
  </div>

  <button class="mobile-scrim" id="mobileScrim" type="button" aria-label="关闭配置面板"></button>
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast-mark">✓</span>
    <span id="toastText">操作成功</span>
  </div>

  <script>
    (() => {
      const panel = document.getElementById("propertyPanel");
      const panelToggle = document.getElementById("panelToggle");
      const panelClose = document.getElementById("panelClose");
      const scrim = document.getElementById("mobileScrim");
      const panelTitle = document.getElementById("panelTitle");
      const panelTag = document.getElementById("panelTag");
      const nodes = Array.from(document.querySelectorAll(".node"));
      const toast = document.getElementById("toast");
      const toastText = document.getElementById("toastText");
      let toastTimer;

      function isMobile() {
        return window.matchMedia("(max-width: 820px)").matches;
      }

      function setPanel(open) {
        panel.classList.toggle("open", open);
        scrim.classList.toggle("show", open);
        panelToggle.setAttribute("aria-expanded", String(open));
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        toastText.textContent = message;
        toast.classList.add("show");
        toastTimer = window.setTimeout(() => toast.classList.remove("show"), 1800);
      }

      function selectNode(node) {
        nodes.forEach((item) => item.classList.toggle("selected", item === node));
        panelTitle.textContent = node.dataset.title;
        panelTag.textContent = node.dataset.tag;
        panelTag.className = `tag ${node.dataset.tagClass}`;
        if (isMobile()) setPanel(true);
      }

      nodes.forEach((node) => {
        node.addEventListener("click", (event) => {
          if (event.target.closest(".node-menu")) return;
          selectNode(node);
        });
        node.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectNode(node);
          }
        });
      });

      panelToggle.addEventListener("click", () => setPanel(!panel.classList.contains("open")));
      panelClose.addEventListener("click", () => setPanel(false));
      scrim.addEventListener("click", () => setPanel(false));

      document.querySelectorAll("[data-message]").forEach((button) => {
        button.addEventListener("click", () => showToast(button.dataset.message));
      });

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((item) => {
            const active = item === tab;
            item.classList.toggle("active", active);
            item.setAttribute("aria-selected", String(active));
          });
          document.querySelectorAll(".form-section").forEach((section) => {
            section.hidden = section.id !== `tab-${tab.dataset.tab}`;
          });
        });
      });

      document.querySelectorAll(".node-menu").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          showToast("节点操作菜单");
        });
      });

      document.getElementById("editTitle").addEventListener("click", () => {
        const title = document.getElementById("pageTitle");
        const next = window.prompt("请输入模板名称", title.textContent);
        if (next && next.trim()) {
          title.textContent = next.trim();
          showToast("模板名称已更新");
        }
      });

      document.querySelector(".back-button").addEventListener("click", () => showToast("已返回模板列表"));

      let dragState = null;
      const canvas = document.getElementById("workflowCanvas");

      nodes.forEach((node) => {
        node.addEventListener("pointerdown", (event) => {
          if (isMobile() || event.target.closest("button")) return;
          dragState = {
            node,
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            left: node.offsetLeft,
            top: node.offsetTop
          };
          node.setPointerCapture(event.pointerId);
        });

        node.addEventListener("pointermove", (event) => {
          if (!dragState || dragState.pointerId !== event.pointerId) return;
          const maxLeft = Math.max(0, canvas.clientWidth - dragState.node.offsetWidth);
          const maxTop = Math.max(0, canvas.clientHeight - dragState.node.offsetHeight);
          const nextLeft = Math.min(maxLeft, Math.max(0, dragState.left + event.clientX - dragState.startX));
          const nextTop = Math.min(maxTop, Math.max(0, dragState.top + event.clientY - dragState.startY));
          dragState.node.style.left = `${Math.round(nextLeft / 5) * 5}px`;
          dragState.node.style.top = `${Math.round(nextTop / 5) * 5}px`;
        });

        node.addEventListener("pointerup", (event) => {
          if (!dragState || dragState.pointerId !== event.pointerId) return;
          dragState.node.releasePointerCapture(event.pointerId);
          dragState = null;
        });
      });

      window.addEventListener("resize", () => {
        if (!isMobile()) setPanel(false);
      });
    })();
  </script>
</body>
</html>
